# The `ui` service's HTTPS listener, mounted into
# /etc/nginx/tls-conf/ by docker-compose.https.yml (and, in-cluster, by the
# Helm chart's ui-deployment.yaml) and pulled in by the `include` in
# qa-platform-ui/default.conf.template -- the envsubst template that replaced
# the old static nginx.conf; there is no nginx.conf in the tree any more.
# Nothing in the UI image contains this file, so a stack brought up without
# that overlay serves plain HTTP exactly as before.
#
# A FRAGMENT, NOT A SERVER BLOCK. It is included INSIDE the one server block
# default.conf.template declares, so it adds a second listener to the block
# that already carries every location -- the SPA try_files, the /qa/v1 proxy
# and the SSE stream. A separate `server { ... }` would have to restate all of
# them and could then drift from the original.
listen 443 ssl;

# The UI's own leaf, signed by the same dev CA as keycloak's. Two leaves rather
# than one so each private key is mounted into exactly one container; one CA so
# a human imports ONE certificate to reach both. See keycloak-tls/gen-cert.sh.
#
# Both paths are `volume.subpath` mounts of single files out of the shared
# `keycloak-tls` volume -- see the `ui` service in docker-compose.https.yml.
# nginx reads the key in its MASTER process, which is root in nginx:alpine (no
# USER directive), which is why gen-cert.sh can leave ui.key root-owned and
# still out of reach of the uid-1000 keycloak container that mounts the whole
# volume.
ssl_certificate     /etc/nginx/tls/ui.crt;
ssl_certificate_key /etc/nginx/tls/ui.key;
