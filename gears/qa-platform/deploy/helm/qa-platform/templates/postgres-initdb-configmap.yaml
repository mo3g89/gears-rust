{{/* Carries files/initdb/01-create-qa-platform-databases.sh verbatim
     (copied into this chart's files/initdb/ so .Files.Get can reach it --
     Helm's .Files is scoped to the chart directory and cannot read files
     outside it via ../). Do not edit the embedded script here; edit the
     source under the chart's own files/ directory and re-copy it. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: qa-platform-postgres-initdb
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: postgres
data:
  01-create-qa-platform-databases.sh: |
{{ .Files.Get "files/initdb/01-create-qa-platform-databases.sh" | indent 4 }}
