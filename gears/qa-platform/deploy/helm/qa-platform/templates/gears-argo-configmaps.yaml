{{/* The two YAML fragments deploy/docker/entrypoint.sh inserts into the
     gears' rendered config, at the QA_RUNS_ARGO_ANCHOR and
     QA_ENVIRONMENTS_ARGO_ANCHOR comment lines in
     gears/qa-platform/config/qa-platform-stack.yaml (this chart's copy of it,
     see gears-config-configmap.yaml).

     NEITHER FRAGMENT BELOW CARRIES `kubeconfig_path`, and that is deliberate.
     Handing the gears a kubeconfig file is what a deployment running them
     OUTSIDE the cluster has to do (and it then has to rewrite that file's
     `server:` away from 127.0.0.1, which inside a container names the
     container). Inside a pod none of that applies: an ABSENT kubeconfig_path
     means both qa-runs' and qa-environments' Argo
     clients fall back to `Config::infer()`, which finds the projected
     ServiceAccount token gears-serviceaccount.yaml's `qa-platform-gears`
     account mounts automatically, and the in-cluster API server address
     baked into every pod's environment
     (KUBERNETES_SERVICE_HOST/KUBERNETES_SERVICE_PORT). That IS the in-cluster
     credential path this whole task exists to wire up -- not a fallback to
     work around.

     entrypoint.sh (gears/qa-platform/deploy/docker/entrypoint.sh) still
     refuses to start if QA_RUNS_ARGO_CONFIG is set without
     QA_ENVIRONMENTS_ARGO_CONFIG, and gears-deployment.yaml sets both
     unconditionally: this chart runs the REAL Argo executor always. There is
     no mock-executor variant to switch between -- in-cluster IS the Argo
     deployment.

     INDENTATION IS LOAD-BEARING. entrypoint.sh's validate_fragment requires
     every non-blank line to start with exactly six spaces (a top-level key
     of `gears.qa-runs.config` / `gears.qa-environments.config`) or more (a
     nested value) -- six spaces is the depth of `dispatcher_enabled:` /
     `max_variables:` in gears/qa-platform/config/qa-platform-stack.yaml. The
     `define`s below write that six-space indentation as literal text in the
     fragment body.

     THE CONFIGMAP VALUE IS toJson'd, NOT A `|` BLOCK LITERAL, and that is not
     a style choice -- it is what makes the six-space prefix survive at all.
     A literal block scalar's indentation is auto-detected from its FIRST
     content line and then stripped from every line: since that first line
     (a `#` comment) sits at the SAME six-space depth as `executor:`/`argo:`
     below it, a `|` block would strip exactly those six spaces back off,
     landing the fragment's top-level keys at column 0 and its nested
     `argo:` children at column 2 instead of 6/8 -- wrong, and wrong in a way
     `helm template`'s own YAML output looks fine at a glance (the ConfigMap
     parses; only the MOUNTED FILE's content, one parse later, is short six
     spaces). Measured while writing this file. `toJson` instead renders the
     whole value as one double-quoted, `\n`-escaped JSON string, which YAML
     parses byte-for-byte with no indentation auto-detection at all --
     `trimPrefix "\n"` only strips the one leading blank line `define`/`}}`
     (without a trim marker, to preserve the first content line's own six
     leading spaces) otherwise leaves in the captured template output. */}}
{{- define "qa-platform.gearsArgoQaRunsFragment" }}
      # GENERATED by the qa-platform Helm chart's gears-argo-configmaps.yaml.
      # Regenerated on every `helm upgrade`; edits made directly to this
      # ConfigMap are lost. Inserted into the gears' rendered config after
      # the QA_RUNS_ARGO_ANCHOR line by deploy/docker/entrypoint.sh.
      executor: argo
      # NOT an `ArgoExecutorConfig` field -- `QaRunsConfig::max_concurrent_runs`,
      # a sibling of `dispatcher_enabled` in the committed stack file, which is
      # why it sits at the fragment's own six-space depth rather than inside
      # `argo:` below. It rides this fragment because this fragment is the only
      # insertion point the chart has into `gears.qa-runs.config` (the stack
      # file itself is embedded verbatim) and because gears-deployment.yaml sets
      # QA_RUNS_ARGO_CONFIG unconditionally, so this fragment is always
      # inserted. `0` is the documented "unbounded" opt-out and was
      # unreachable in the shipped image before this row -- whole-branch
      # review I1. See values.yaml's `qaRuns` block for why `${VAR:-...}` in
      # the stack file is not an alternative.
      max_concurrent_runs: {{ .Values.qaRuns.maxConcurrentRuns }}
      argo:
        namespace: {{ .Values.argo.namespace }}
        # NO kubeconfig_path -- see this file's header comment.
        runner_image: {{ printf "%s:%s" .Values.images.runner.repository .Values.images.runner.tag | quote }}
        workflow_service_account: {{ .Values.argo.workflowServiceAccount | quote }}
        workflow_ttl_seconds: {{ .Values.argo.workflowTtlSeconds }}
        status_poll_seconds: {{ .Values.argo.statusPollSeconds }}
        log_follow_idle_seconds: {{ .Values.argo.logFollowIdleSeconds }}
        # A workflow pod reaches the gears through the in-cluster Service
        # directly: gears-service.yaml is a normal ClusterIP Service, so
        # nothing here is loopback-bound and no nginx hop is needed.
        bundle_base_url: {{ printf "http://qa-platform-gears.%s.svc.cluster.local:%d" .Release.Namespace (.Values.gears.port | int) | quote }}
        # NO SECRET VALUE HERE: client_secret_secret/_key NAME a Kubernetes
        # Secret (workflow-oidc-secret.yaml creates it) that the KUBELET
        # resolves. This adapter never opens it -- see ADR-0001.
        bundle_auth:
          token_url: {{ printf "http://qa-platform-keycloak.%s.svc.cluster.local:8080/realms/qa-platform/protocol/openid-connect/token" .Release.Namespace | quote }}
          client_id: {{ .Values.argo.workflowClientId | quote }}
          client_secret_secret: {{ .Values.argo.workflowSecretName | quote }}
          client_secret_key: {{ .Values.argo.workflowSecretKey | quote }}
{{- end }}
{{- define "qa-platform.gearsArgoQaEnvironmentsFragment" }}
      # QA_ENVIRONMENTS_ARGO_FRAGMENT
      # ^ A marker, not decoration. entrypoint.sh greps the RENDERED config
      # for this exact line to prove THIS fragment's insertion happened,
      # rather than the qa-runs fragment's. The two fragments are otherwise
      # similar enough to confuse, so the marker is what entrypoint.sh checks.
      # GENERATED by the qa-platform Helm chart's gears-argo-configmaps.yaml.
      # Regenerated on every `helm upgrade`; edits made directly to this
      # ConfigMap are lost. Inserted into the gears' rendered config after
      # the QA_ENVIRONMENTS_ARGO_ANCHOR line by deploy/docker/entrypoint.sh.
      argo:
        # NO kubeconfig_path -- see this file's header comment. Falls back to
        # Config::infer(), same as the qa-runs fragment above.
        # Must equal the qa-runs fragment's argo.namespace: the runner pod's
        # kubeconfig Secret (decision D4) has to land in the namespace its
        # Workflow runs in.
        namespace: {{ .Values.argo.namespace }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qa-platform-gears-argo-qa-runs
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: gears
data:
  qa-runs-argo.yaml: {{ include "qa-platform.gearsArgoQaRunsFragment" . | trimPrefix "\n" | toJson }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qa-platform-gears-argo-qa-environments
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: gears
data:
  qa-environments-argo.yaml: {{ include "qa-platform.gearsArgoQaEnvironmentsFragment" . | trimPrefix "\n" | toJson }}
