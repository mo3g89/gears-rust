{{/* Fixed interface: qa-platform-ui:80 and :443, ClusterIP. In-cluster callers (a
     later task's verification Job, gears-argo-configmaps.yaml's
     bundle_base_url should it ever need the UI rather than the gears) reach
     the SPA/API/IdP edge here; the node's hostPort 80/443 (ui-deployment.yaml)
     is what a browser outside the cluster reaches instead -- the two are
     independent paths to the same pod, same shape as qa-platform-gears's
     Service alongside its (absent) hostPort. */}}
apiVersion: v1
kind: Service
metadata:
  name: qa-platform-ui
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: ui
spec:
  selector:
    {{- include "qa-platform.selectorLabels" (dict "root" $ "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
    # 443 IS NOT DECORATION -- gears-deployment.yaml's hostAliases fallback
    # depends on it. When gears.hostAliases.enabled is true, that block maps
    # publicHost to THIS Service's ClusterIP, and the gears then dial
    # `https://<publicHost>` -- i.e. port 443 on this Service. With only port
    # 80 published, every such call was refused at connect with nothing in the
    # chart naming why, and the fallback for a broken pod->node hairpin could
    # never have worked. The UI container listens on 443 for TLS (see
    # ui-deployment.yaml's `https` port and files/ui-tls/tls.conf), so this is
    # a targetPort of a port that genuinely exists.
    - name: https
      port: 443
      targetPort: https
