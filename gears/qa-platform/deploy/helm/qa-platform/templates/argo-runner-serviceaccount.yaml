{{/* The runner pod's declared identity -- `spec.serviceAccountName` on every
     Workflow qa-runs submits (`qa-runs.argo.workflow_service_account`,
     rendered by gears-argo-configmaps.yaml:74 from `argo.workflowServiceAccount`
     below).

     Lives in ARGO's namespace, not this release's: the Workflow, and so its
     pod and that pod's ServiceAccount, run in `.Values.argo.namespace` --
     the same reasoning rbac-argo.yaml's own header comment gives for why
     THAT RoleBinding's subject carries an explicit `namespace:` rather than
     inheriting `.Release.Namespace`. Get this namespace wrong and the account
     this template creates is simply never the one the Workflow names -- Argo
     falls back to `default` in `.Values.argo.namespace` with no error at all,
     which is exactly the silent fall-through this task exists to close.

     MINIMAL, NOT EMPTY -- corrected from an earlier "no Role at all" cut of
     this template, which broke every run. See rbac-argo-runner.yaml (this
     file's sibling) for the Role/RoleBinding this account now carries and the
     live-cluster evidence for exactly which two verbs it grants.

     NO `automountServiceAccountToken: false` HERE, and that is also a
     correction, not the original design. This pod's second container is
     Argo's own executor (`wait`), which authenticates to the API server AS
     THIS SERVICE ACCOUNT to write the `workflowtaskresults` object
     rbac-argo-runner.yaml grants it -- unlike `kubectl`/`helm`/`istioctl` in
     the `main` container, `wait` is not optional tooling a plugin author
     might invoke, it is how every run reports its result at all. Setting this
     `false` here left `wait` with no token to authenticate with regardless of
     what the Role granted, which is a harder failure than the missing Role
     alone. The pod-level `spec.automountServiceAccountToken: false` this
     mirrored (`argo/workflow.rs`, Task 1 of this workstream) is gone too --
     the pod's builder now leaves the field unset with a comment explaining
     why, and `ArgoExecutorConfig::automount_service_account_token`, the knob
     that used to drive it, was deleted as dead configuration (fix round 2):
     nothing rendered it into the chart and nothing but the field itself read
     it, so an operator setting it would have controlled nothing. What
     actually bounds this account's reach now is rbac-argo-runner.yaml's Role,
     not whether the token is mounted. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.argo.workflowServiceAccount | quote }}
  namespace: {{ .Values.argo.namespace | quote }}
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: argo-runner
