{{/* The realm is rendered HERE, from `files/keycloak/realm-qa-platform.json`.

     Keycloak 26.0.8 will not expand a `${env.VAR}` placeholder in an import
     file — measured, it aborts start-up — so the browser-facing origin, the
     seed tenant and the workflow client's secret have to be substituted before
     the file reaches the container. That used to mean rendering the realm with
     a shell script and handing the result to Helm with `--set-file`, which made
     `helm install` alone insufficient to install the stack.

     `tpl` does the same substitution at template time, from the same values the
     rest of the chart reads, so the chart installs on its own. What the file
     carries is three placeholders and nothing else: publicOrigin (added to the
     UI client's redirectUris and webOrigins, beside the localhost entries a
     port-forward needs), seedTenantId (the `tenant_id` claim every seeded user
     gets, which oidc-authn-plugin maps onto the tenant seed-tenant.sh creates)
     and argo.workflowClientSecret (pinned here so the
     `qa-platform-workflow` client's secret is a known value; the Secret
     template that used to read the same value back into Argo's namespace is
     deleted, see the runner-pod credential note in values.yaml).

     EVERY PLACEHOLDER IS `| toString | toJson`, never `"{{ .Values.x }}"`.
     The file is JSON, and a bare interpolation inside a literal "..." turns a
     value carrying `"` or `\` (an operator's generated secret can) into
     invalid JSON, which Keycloak's --import-realm answers by aborting start-up.
     `toJson` emits the quoted, escaped string itself; `toString` first,
     because `--set seedTenantId=42` arrives as a number and `toJson` would
     render it unquoted. The committed-literal comparison below takes the
     same `toString`, or a numeric secret errors the render.
     check_realm_secrecy.py covers both.

     publicOrigin is added BESIDE the `http://localhost:8080` entries rather
     than replacing them, so the same realm serves a browser reaching the UI
     through the ingress and one reaching it through `kubectl port-forward`.
     It is a whole ORIGIN, never a bare host: an https deploy serves on 443,
     443 is https's default port, and Keycloak compares `webOrigins` against
     the browser's `Origin:` header as STRINGS — so `https://host:443` does not
     match an `Origin:` of `https://host` and the CORS preflight on the token
     request fails after the redirect, at the point that looks least like an
     origin problem.

     `webOrigins` gets the concrete origin and never `"*"`: `"*"` makes Keycloak
     answer `Access-Control-Allow-Origin: *` for this client, turning a
     deliberate two-origin allowance into an any-origin one.

     NOTE THE ONE-SHOT TRAP: Keycloak reads its import directory only on a
     FIRST start against an empty database, so changing this Secret does not
     re-import anything on a Keycloak that has already started once. Restart the
     pod (its H2 store is ephemeral by design — see keycloak-deployment.yaml) or
     make the change through the admin API.

     `.Values.keycloakRealmJson` remains an escape hatch: set it — with
     `--set-file` or otherwise — to supply a realm this chart did not build,
     and this template uses it verbatim.

     A SECRET, NOT A CONFIGMAP — this file used to render a ConfigMap, which
     put the workflow client's confidential secret (argo.workflowClientSecret,
     substituted above) in the clear for anything in the namespace that can
     read ConfigMaps. the chart already treated that value as secret
     material wherever else it appeared; this template now agrees. Object identity is
     unchanged — `kind: Secret`, name `qa-platform-realm`, key
     `realm-qa-platform.json` — only `data:` became `stringData:` and
     keycloak-deployment.yaml's volume moved from `configMap:` to `secret:`.
     Anything reading this out-of-band (verify-k8s.sh's check 16) must switch
     from `kubectl get configmap` to `kubectl get secret` accordingly.

     THE TWO GUARDS BELOW, and why they live here rather than in the realm
     file. `argo.workflowClientSecret` is the `qa-platform-workflow` client's
     confidential secret, and that client is `serviceAccountsEnabled` and
     `fullScopeAllowed`: a client-credentials token minted with it carries
     full tenant access. It sat OUTSIDE the realm file's `{{if devMode}}`
     block -- that block wraps the seeded `users` array and nothing else --
     as a bare committed literal with no `required`, so every install
     published that credential in this repository, and
     runner-networkpolicy.yaml's rule 3 opens 0.0.0.0/0 minus the cluster
     CIDRs, so reachability was never what kept it shut.

     `required` plus a `fail` on the committed literal unless devMode is
     exactly the pair `keycloak.adminPassword` already gets (its `required`
     in keycloak-admin-secret.yaml, its devMode refusal in
     keycloak-deployment.yaml), deliberately rather than a new shape.
     The `else` branch carries them for argo.workflowClientSecret, plus a
     16-character floor (2026-10-07): `checksum/realm` on the Keycloak pod
     is a sha256 of this rendered realm, readable with `get pods`, so a
     short secret is an offline guess. THE keycloakRealmJson BRANCH IS HELD
     TO THE SAME TWO RULES (2026-10-07), against the realm itself, since
     nothing reads argo.workflowClientSecret in that mode: the dev literal
     anywhere in the supplied text, or as any client's decoded `secret`
     (so a JSON escape does not spell it past the text match), is refused
     outside devMode, and a
     qa-platform-workflow client whose `secret` is under 16 characters is
     refused always. A supplied realm with no such client renders as given.

     THE CLIENT ITSELF STAYS. verify-k8s.sh check 16 needs a non-browser
     credential to prove the product-plugin catalogue is non-empty on a
     stand, and the realm's only other client (qa-platform-ui) has
     directAccessGrantsEnabled off on purpose. verify-k8s.sh reads the value
     from the release rather than hardcoding it. `check_realm_secrecy.py`
     holds both guards.

     KEYCLOAK IMPORTS A REALM ONLY ON A FIRST START against an empty
     database, so changing this value is not enough on its own -- the pod has
     to restart, at which point its ephemeral H2 store is empty and the realm
     re-imports. keycloak-deployment.yaml carries a `checksum/realm` pod
     annotation for exactly that, so a changed realm rolls the pod by itself
     instead of being written, reported successful and silently ignored. */}}
apiVersion: v1
kind: Secret
metadata:
  name: qa-platform-realm
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: keycloak
type: Opaque
stringData:
  realm-qa-platform.json: |
{{- if .Values.keycloakRealmJson }}
{{- $supplied := toString .Values.keycloakRealmJson }}
{{- if and (not .Values.devMode) (contains "qa-platform-workflow-dev-secret" $supplied) }}
{{- fail "Refusing to install a supplied keycloakRealmJson that carries the development workflow client secret. `qa-platform-workflow-dev-secret` is a literal published in this repository; pinned on the serviceAccountsEnabled, fullScopeAllowed qa-platform-workflow client it gives full tenant access to anyone who can reach the token endpoint. Give that client a generated secret in the realm you supply, or set devMode=true if this is a throwaway stand." }}
{{- end }}
{{- range (get (fromJson $supplied) "clients" | default list) }}
{{- if kindIs "map" . }}
{{- /* The `contains` above reads the raw text, so a JSON escape (`\u002d`
     for a `-`) or padding spells the literal past it; this compares the
     DECODED value, on every client. */}}
{{- if and (not $.Values.devMode) (hasKey . "secret") (eq (trim (toString (get . "secret"))) "qa-platform-workflow-dev-secret") }}
{{- fail "Refusing to install a supplied keycloakRealmJson that carries the development workflow client secret. `qa-platform-workflow-dev-secret` is a literal published in this repository; pinned on the serviceAccountsEnabled, fullScopeAllowed qa-platform-workflow client it gives full tenant access to anyone who can reach the token endpoint. Give that client a generated secret in the realm you supply, or set devMode=true if this is a throwaway stand." }}
{{- end }}
{{- if and (eq (toString (get . "clientId")) "qa-platform-workflow") (hasKey . "secret") }}
{{- if lt (len (trim (toString (get . "secret")))) 16 }}
{{- fail "Refusing to install a supplied keycloakRealmJson whose qa-platform-workflow client secret is shorter than 16 characters. That client is serviceAccountsEnabled and fullScopeAllowed, and keycloak-deployment.yaml publishes a sha256 of this realm as the checksum/realm pod annotation, readable by anyone who can `get pods` -- a short secret can be guessed offline. The secret must be at least 16 characters (a realm exported from Keycloak masks it as `**********`; put the real one back)." }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{ .Values.keycloakRealmJson | indent 4 }}
{{- else }}
{{- $workflowSecret := toString (required "argo.workflowClientSecret is required: it is the confidential secret of the qa-platform-workflow client, which is serviceAccountsEnabled and fullScopeAllowed, so a client-credentials token minted with it carries full tenant access. There is no safe default -- it shipped as a committed literal until 2026-09-29. Set it once and keep it, e.g. --set-file argo.workflowClientSecret=<(printf '%s' \"$(openssl rand -hex 24)\")" .Values.argo.workflowClientSecret) }}
{{- if and (not .Values.devMode) (eq $workflowSecret "qa-platform-workflow-dev-secret") }}
{{- fail "Refusing to install with the development workflow client secret. `qa-platform-workflow-dev-secret` is a literal published in this repository, and the qa-platform-workflow client is serviceAccountsEnabled and fullScopeAllowed -- anyone who can reach the token endpoint gets full tenant access with a string out of the repository. Set argo.workflowClientSecret, or set devMode=true if this is a throwaway stand." }}
{{- end }}
{{- if lt (len (trim $workflowSecret)) 16 }}
{{- fail "Refusing to install with an argo.workflowClientSecret shorter than 16 characters (after trimming whitespace). The qa-platform-workflow client is serviceAccountsEnabled and fullScopeAllowed, and keycloak-deployment.yaml publishes a sha256 of the rendered realm as the checksum/realm pod annotation, readable by anyone who can `get pods`, so a short secret can be guessed offline. The secret must be at least 16 characters -- the floor qa-catalog and qa-insights already apply to their signing secrets -- e.g. --set-file argo.workflowClientSecret=<(printf '%s' \"$(openssl rand -hex 24)\")" }}
{{- end }}
{{ tpl (.Files.Get "files/keycloak/realm-qa-platform.json") . | indent 4 }}
{{- end }}
