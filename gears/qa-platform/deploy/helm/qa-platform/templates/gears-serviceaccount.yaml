{{/* The identity the gears pod runs as. Automounting the token is left at its
     default (true, unset here) deliberately: with QA_RUNS_ARGO_CONFIG and
     QA_ENVIRONMENTS_ARGO_CONFIG both set and carrying no kubeconfig_path (see
     gears-argo-configmaps.yaml), qa-runs' and qa-environments' Argo clients
     both fall back to Config::infer(), which resolves the API server from
     this projected token -- that IS the in-cluster credential path, not a
     fallback to avoid.

     NOT named `qa-runs`, matching deploy/argo/qa-runs-rbac.yaml's old
     ServiceAccount: that one was created with `kubectl apply` and carries no
     Helm ownership metadata (verified 2026-08-29 -- only a
     last-applied-configuration annotation), so Helm refuses to adopt it
     ("invalid ownership metadata"). This chart uses a new name and the old
     trio (ServiceAccount + Role + RoleBinding, all named qa-runs/qa-runs-executor)
     is deleted as an operator step in Task 13, after this one is verified
     working. `qa-platform-gears` is also more accurate regardless: one pod,
     one ServiceAccount, all four gears -- not qa-runs alone. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qa-platform-gears
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: gears
