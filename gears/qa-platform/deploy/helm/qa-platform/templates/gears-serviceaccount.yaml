{{/* The identity the gears pod runs as. Automounting the token is left at its
     default (true, unset here) deliberately: QA_RUNS_ARGO_CONFIG carries no
     kubeconfig_path (see gears-argo-configmaps.yaml), so qa-runs' Argo client
     falls back to Config::infer(), which resolves the API server from this
     projected token -- that IS the in-cluster credential path, not a
     fallback to avoid. rbac-argo.yaml grants this account workflows, pods and
     pods/log in the Argo namespace, and NO `secrets` (finding #94).

     qa-environments' D4 runner-credential writer does NOT run as this
     account: its fragment sets kubeconfig_path to a kubeconfig for
     `qa-platform-secret-writer` (secret-writer-serviceaccount.yaml), the one
     identity that holds create/patch on Secrets in the Argo namespace.

     NOT named `qa-runs`, matching deploy/argo/qa-runs-rbac.yaml's old
     ServiceAccount: that one was created with `kubectl apply` and carries no
     Helm ownership metadata (verified 2026-08-29 -- only a
     last-applied-configuration annotation), so Helm refuses to adopt it
     ("invalid ownership metadata"). This chart uses a new name and the old
     trio (ServiceAccount + Role + RoleBinding, all named qa-runs/qa-runs-executor)
     is deleted as an operator step in Task 13, after this one is verified
     working. `qa-platform-gears` is also more accurate regardless: it is
     the pod's identity for all four gears, not qa-runs alone (the D4 writer's
     separate token, above, is the one exception). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qa-platform-gears
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: gears
