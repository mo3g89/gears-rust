{{/* The confidential client secret an Argo workflow authenticates with.

     A run's pod posts its results back to the gears, and it authenticates as
     the realm's `qa-platform-workflow` client to do it. The client is
     confidential, so it has a secret, and that secret has to exist as a
     Kubernetes Secret in ARGO's namespace — not this release's — because that
     is where the workflow pods run.

     WHY A SECRET IS NEEDED AT ALL: `GET /qa/v1/test-bundles/{id}` is
     `.authenticated()`, so a workflow pod fetching its bundle gets a 401
     without a token. It cannot borrow a user's — it has no user — so the realm
     carries a confidential service-account client with a HARDCODED `tenant_id`
     claim, hardcoded because a service account has no user profile to read an
     attribute from and oidc-authn-plugin requires that claim to parse as a
     UUID.

     WHY THE SECRET IS PRE-PROVISIONED HERE AND NOT BY qa-runs: the Argo adapter
     never resolves secret material — it emits a `secretKeyRef` and lets the
     kubelet resolve it, which is ADR-0001's waiver condition that `RunSpec`
     carries secret REFERENCES and never material. A qa-runs process that
     created this Secret would have to hold the client secret in memory, and
     that sentence would stop being true.

     This used to be a post-install shell script that read the secret out of the
     rendered realm with `jq` and `kubectl create secret`. It is a template
     now, reading the same value the realm template does, so the two cannot
     drift and `helm install` alone is enough. The committed default is a DEV
     FIXTURE, in the same category as this chart's admin/admin and postgres
     qa/qa: a deployment that wants a real secret sets `argo.workflowClientSecret`,
     which moves the realm and this Secret together.

     Set `argo.createWorkflowSecret: false` when Argo's namespace does not exist
     or is managed elsewhere — the gears still start; only run submission needs
     this Secret.

     IF `helm upgrade` FAILS HERE with "Secret \"qa-platform-workflow-oidc\" in
     namespace \"argo\" exists and cannot be imported into the current release:
     invalid ownership metadata", the cluster has a Secret of this name that
     Helm did not create — on a cluster that predates this template, the
     post-install script that used to create it. Helm will not take ownership
     of an object carrying no release metadata. Adopt it in place (no workflow
     loses its reference, and the value is unchanged):

       kubectl -n argo label secret qa-platform-workflow-oidc \
           app.kubernetes.io/managed-by=Helm --overwrite
       kubectl -n argo annotate secret qa-platform-workflow-oidc \
           meta.helm.sh/release-name=<release> \
           meta.helm.sh/release-namespace=<namespace> --overwrite

     Deleting it and re-running works too, but breaks any workflow pod that is
     mid-flight with the Secret already resolved. */}}
{{- if .Values.argo.createWorkflowSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.argo.workflowSecretName | quote }}
  namespace: {{ .Values.argo.namespace | quote }}
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: argo-workflow-oidc
  annotations:
    {{/* Adopted rather than owned: the namespace belongs to Argo's release, and
         a `helm uninstall` of qa-platform should not delete a Secret a running
         workflow may still be using. */}}
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.argo.workflowSecretKey }}: {{ required "argo.workflowClientSecret is required when argo.createWorkflowSecret is true" .Values.argo.workflowClientSecret | quote }}
{{- end }}
