{{/* The identity qa-environments' D4 runner-credential writer authenticates as
     (finding #94) -- and nothing else does. rbac-argo.yaml's
     `qa-platform-secret-writer` Role grants it create+patch on Secrets in
     .Values.argo.namespace; qa-platform-gears, the pod's own account, no
     longer holds that grant.

     NO POD RUNS AS THIS ACCOUNT, hence `automountServiceAccountToken: false`.
     A projected ServiceAccount token is always for the pod's OWN account
     (gears-deployment.yaml's `serviceAccountName: qa-platform-gears`, which
     qa-runs still needs through Config::infer()), so a second identity in the
     same pod has to come from a legacy `kubernetes.io/service-account-token`
     Secret: the token controller populates `token`, `ca.crt` and `namespace`
     into it. gears-deployment.yaml mounts `token` and `ca.crt` at
     /var/run/secrets/qa-platform/secret-writer, and the kubeconfig
     gears-argo-configmaps.yaml renders reads them from there (`tokenFile`,
     which kube-client re-reads, and `certificate-authority`).

     NO `data` IS RENDERED, deliberately. The controller owns it; Helm's
     three-way merge only removes fields a previous manifest set, so an
     upgrade leaves the populated token alone. The token does not expire; it
     is revoked by deleting this Secret (the controller does not re-issue it
     -- the next `helm upgrade` recreates it and the controller fills it
     again). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qa-platform-secret-writer
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: secret-writer
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: qa-platform-secret-writer-token
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: secret-writer
  annotations:
    kubernetes.io/service-account.name: qa-platform-secret-writer
type: kubernetes.io/service-account-token
