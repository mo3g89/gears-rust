apiVersion: v1
kind: Service
metadata:
  name: qa-platform-postgres
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    {{- include "qa-platform.selectorLabels" (dict "root" $ "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
