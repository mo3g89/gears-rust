{{/* Narrows what qa-platform-secret-writer's namespace-wide grant can actually
     do (finding #94, fix round 1). RBAC cannot express it: `create` ignores
     `resourceNames`, and the writer's names are derived at runtime. Without
     this policy the grant would let whoever holds the writer's token:
       - mint a `kubernetes.io/service-account-token` Secret for ANY
         ServiceAccount in the Argo namespace (Argo's controller and server
         accounts included), which the token controller then fills with a
         working token; and
       - overwrite any existing Secret in that namespace by name.
     This policy denies both. From the writer's identity it admits only
     CREATE/UPDATE of an `Opaque` Secret whose name starts with the runner
     prefix (`qa-platform.runnerSecretPrefix`, the same helper the
     qa-environments fragment's `argo.secret_prefix` renders from). Every name
     `secret_name` in runner_secret_writer.rs derives starts with that prefix:
     the helper's value is already sanitised, and it is shorter than the
     readable budget, so truncation never reaches it. The digest-only fallback
     is unreachable, because the readable head always holds the tenant UUID.

     `matchConditions` limit it to requests from that one account, so no
     other writer of Secrets in the namespace (Argo itself, an operator, the
     token controller) is ever evaluated. A server-side apply is a PATCH,
     which admission sees as UPDATE (CREATE for the first apply).

     RENDERED ONLY WHERE THE API IS SERVED. ValidatingAdmissionPolicy is GA
     (admissionregistration.k8s.io/v1) from Kubernetes 1.30. On an older
     cluster Helm's discovery has no such kind, and this renders nothing. The
     writer then keeps the whole namespace-wide grant, token minting
     included -- ADR-0008 records that. verify-k8s.sh's `k8s 3/4` checks the
     denial with a server-side dry run wherever the API is served.

     A `helm template` WITH NO CLUSTER (a GitOps pipeline rendering manifests
     for Argo CD/Flux, or CI) has no discovery either, so it omits this policy
     and its binding on a cluster that DOES serve the API -- silently. Pass
     `--api-versions admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy`
     to such a render. CI's kubeconform step does, and
     check_ci_render_values.py fails if it stops.

     Cluster-scoped, so the name carries the release namespace: this chart
     supports one release per namespace, and two releases in different
     namespaces must not fight over one policy object. */}}
{{- if .Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: qa-platform-secret-writer-guard-{{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: secret-writer
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.argo.namespace }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  matchConditions:
    - name: from-the-secret-writer
      expression: 'request.userInfo.username == "system:serviceaccount:{{ .Release.Namespace }}:qa-platform-secret-writer"'
  validations:
    - expression: '!has(object.type) || object.type == "Opaque"'
      message: "qa-platform-secret-writer may only write Opaque Secrets (finding #94: a service-account-token Secret would mint a token for another account)"
    - expression: 'object.metadata.name.startsWith("{{ include "qa-platform.runnerSecretPrefix" . }}")'
      message: "qa-platform-secret-writer may only write Secrets named with the runner prefix {{ include "qa-platform.runnerSecretPrefix" . }}"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: qa-platform-secret-writer-guard-{{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: secret-writer
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  policyName: qa-platform-secret-writer-guard-{{ .Release.Namespace }}
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.argo.namespace }}
{{- end }}
