{{/* postgres.password: `required`, and its committed fixture `qa` refused
     unless devMode -- the same pair keycloak.adminPassword gets in
     keycloak-admin-secret.yaml / keycloak-deployment.yaml and
     argo.workflowClientSecret gets in keycloak-realm-secret.yaml. Until
     2026-10-07 values.yaml shipped `password: qa` with no refusal, so every
     install that did not override it ran its database as qa/qa, a pair
     published in this repository.

     `toString` before the comparison, as the realm template does: `--set
     postgres.password=123456` arrives as a number. check_postgres_password.py
     is the guard.

     POSTGRES APPLIES THIS ONLY WHEN IT INITIALISES AN EMPTY DATA DIRECTORY.
     Changing it on a release whose volume already exists rewrites this
     Secret and rolls the gears (checksum/postgres-secret), and the database
     still answers to the old password -- change the role's password inside
     Postgres first. UPGRADING.md's "Also required, from 2026-10-07:
     `postgres.password`" has the commands. */}}
{{- $pgPassword := toString (required "postgres.password is required: the database's password has no safe default (it shipped as the committed literal `qa` until 2026-10-07). Set it once and keep it, e.g. --set-file postgres.password=<(printf '%s' \"$(openssl rand -hex 24)\"). On an existing release the database keeps the password it was initialised with -- see UPGRADING.md before changing it." .Values.postgres.password) }}
{{- if and (not .Values.devMode) (eq $pgPassword "qa") }}
{{- fail "Refusing to install with the development Postgres password. postgres.password=qa is a literal published in this repository. Set postgres.password (and change the role's password inside Postgres first on an existing release -- UPGRADING.md), or set devMode=true if this is a throwaway stand." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: qa-platform-postgres
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_USER: {{ required "postgres.user is required" .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
