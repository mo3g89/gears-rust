{{/* Fixed interface: qa-platform-gears:8087. Reachable in-cluster ONLY: it
     has no NodePort and no LoadBalancer type, so the only ports a caller
     outside the cluster ever reaches are the ui Service's. A pod in another namespace (an Argo workflow pod fetching a
     test bundle) reaches this Service at its fully-qualified name,
     qa-platform-gears.<release namespace>.svc.cluster.local:8087 -- see
     gears-argo-configmaps.yaml's bundle_base_url. */}}
apiVersion: v1
kind: Service
metadata:
  name: qa-platform-gears
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: gears
spec:
  selector:
    {{- include "qa-platform.selectorLabels" (dict "root" $ "component" "gears") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gears.port }}
      targetPort: http
{{/* The metrics port is published on this Service and NOWHERE ELSE. This
     Service is ClusterIP with no NodePort and no LoadBalancer (see the header
     above), and the ingress in front of the stack routes only `http`, so
     adding this port does not make the scrape endpoint reachable from outside
     the cluster -- it makes it reachable from a scraper Pod, and from
     `kubectl port-forward svc/qa-platform-gears 9464:9464`.

     `targetPort: metrics` by NAME, matching gears-deployment.yaml's
     containerPort name, so the two cannot disagree about the number even
     though both read the same value. Gated on the same switch as the
     containerPort: a Service port whose named targetPort does not exist on
     the pod is an endpoint that never becomes ready, silently. */}}
{{- if .Values.opentelemetry.metrics.scrape.enabled }}
    - name: metrics
      port: {{ .Values.gears.metricsPort }}
      targetPort: metrics
{{- end }}
