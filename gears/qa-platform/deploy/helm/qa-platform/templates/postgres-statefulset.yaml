apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qa-platform-postgres
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: postgres
spec:
  serviceName: qa-platform-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qa-platform
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qa-platform
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: qa-platform-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qa-platform-postgres
                  key: POSTGRES_PASSWORD
            # POSTGRES_DB alone provisions exactly one database ("postgres");
            # the eight per-gear databases come from the initdb script mounted
            # below.
            - name: POSTGRES_DB
              value: postgres
            # Keep PGDATA a level below the mount point -- local-path's PV
            # root sometimes carries a lost+found dir that upsets postgres's
            # own "data directory is not empty" check otherwise.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.user | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.user | quote }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: initdb
          configMap:
            name: qa-platform-postgres-initdb
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          app.kubernetes.io/name: qa-platform
          app.kubernetes.io/component: postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.persistence.storageClass }}
        storageClassName: {{ .Values.postgres.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
