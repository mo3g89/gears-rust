{{/* keycloak.adminUser / keycloak.adminPassword as an actual K8s Secret,
     the way postgres-secret.yaml already does the same thing for
     postgres.user/postgres.password.

     Before this file existed, keycloak-deployment.yaml set
     KC_BOOTSTRAP_ADMIN_USERNAME/KC_BOOTSTRAP_ADMIN_PASSWORD as plain `value:`
     entries in the PodSpec -- readable by anything that can `kubectl get
     deployment qa-platform-keycloak -o yaml`, which is typically far wider
     RBAC than `get secrets`. Routing them through this Secret and
     `valueFrom.secretKeyRef` in the Deployment closes that specific read
     path, the same way keycloak-realm-secret.yaml closed it for the
     workflow client's secret.

     THIS DOES NOT MAKE keycloak.adminPassword's ORIGIN SECRET: it still
     arrives via `--set`/`-f` on the `helm install`/`helm upgrade` command
     line, so anything that can run `helm get values` on this release still
     recovers it in the clear -- Helm has no server-side concept of a
     write-only value. What this closes is the DEPLOYMENT-OBJECT read path,
     not the release's own values.

     The `required` guard stays here, not duplicated in
     keycloak-deployment.yaml -- Helm evaluates every template in a release
     before installing any of them, so a `fail`/`required` anywhere in the
     chart aborts the whole render; there is no benefit to checking twice,
     and the devMode/"admin"-literal refusal (a `fail`, not a `required`)
     stays in keycloak-deployment.yaml because it reads .Values directly and
     has nothing to do with how the value is delivered to the pod. */}}
apiVersion: v1
kind: Secret
metadata:
  name: qa-platform-keycloak-admin
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: keycloak
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.keycloak.adminUser | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ required "keycloak.adminPassword is required: set it explicitly, there is no default." .Values.keycloak.adminPassword | quote }}
