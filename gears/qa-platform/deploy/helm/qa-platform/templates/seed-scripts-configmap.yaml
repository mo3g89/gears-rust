{{/* Carries files/seed-tenant.sh, read at render time with .Files.Get.
     The file under files/ IS the script -- there is no second copy to keep in
     sync; edit it there.

     Mounted into job-tenant-seed.yaml at /scripts, read-only, and run as
     `bash /scripts/seed-tenant.sh`. See that script's own header for why it
     must run strictly after db-migrate. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: qa-platform-seed-scripts
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: tenant-seed
data:
  seed-tenant.sh: |
{{ .Files.Get "files/seed-tenant.sh" | indent 4 }}
