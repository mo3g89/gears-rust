{{/* One container running all four qa-platform gears
     (cf-gears-example-server, built by qa-platform.Dockerfile). This chart
     runs the real Argo executor unconditionally -- there is no mock-executor
     variant to switch between, because in-cluster IS the Argo deployment.

     NO readOnlyRootFilesystem, and this is deliberate rather than an
     oversight. entrypoint.sh (line ~95) writes its rendered config to
     /var/lib/cf-gears/.rendered-<name> -- the PARENT of the PVC mount at
     /var/lib/cf-gears/data, not a path the PVC itself covers -- and that
     write happens on every container start, before the server ever execs.
     Setting readOnlyRootFilesystem: true here makes that write fail and the
     container refuses to start. Nothing else about the image needs a
     writable root filesystem, but this one write does, so the securityContext
     below stops short of that flag.

     IF YOU ARE READING THIS BECAUSE THIS POD IS CrashLoopBackOff ON A FRESH
     INSTALL: that is expected, not a broken chart. Helm creates this
     Deployment before it ever runs the db-migrate/tenant-seed post-install
     hooks (job-db-migrate.yaml, job-tenant-seed.yaml), so this pod's first
     few boots race a database that has neither schema nor a seeded tenant row
     and abort in oagw's
     post_init. It self-heals once both hooks complete. Full rationale --
     including why deploy-k8s.sh must NOT pass `--wait` to
     `helm upgrade --install` (with `--wait`, this pod's inability to reach
     Ready before the hooks run blocks the hooks from ever running at all),
     and why an initContainer gate here is still not worth adding -- is in
     job-db-migrate.yaml's header comment. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qa-platform-gears
  labels:
    app.kubernetes.io/name: qa-platform
    app.kubernetes.io/component: gears
spec:
  {{- if gt (int .Values.gears.replicaCount) 1 }}
  {{- fail "gears.replicaCount must be 1: the gears PVC is ReadWriteOnce, so a second replica would fail to mount, and qa-runs' dispatcher boot-recovery pass assumes only one process can be mid-submit -- a second replica under NoopLeaderElector would break that premise. This is permanent by design, not pending a fix -- see DESIGN §3.4 (qa-runs -- Leader election)." }}
  {{- end }}
  replicas: {{ .Values.gears.replicaCount }}
  # THE DEFAULT 600s IS MEASURED FROM THE WRONG INSTANT FOR THIS POD, which is
  # why it is raised here and nowhere else in the chart.
  #
  # progressDeadlineSeconds counts from the Deployment's LAST PROGRESS EVENT,
  # not from when anyone starts watching it. Helm creates this Deployment as a
  # normal resource and only THEN runs the db-migrate/tenant-seed post-install
  # hooks, and this pod cannot make progress until both have finished -- so the
  # clock starts at creation and the entire hook window is spent on it. By the
  # time deploy-k8s.sh's `kubectl rollout status` begins, the remaining budget
  # is 600s MINUS however long the hooks took, not 600s.
  #
  # That interacts badly with `kubectl rollout status`: it does not merely wait
  # for its own --timeout, it returns an ERROR THE MOMENT it observes
  # Progressing=False with reason=ProgressDeadlineExceeded. So raising
  # deploy-k8s.sh's ROLLOUT_TIMEOUT cannot buy back what the deadline already
  # spent -- the ceiling is the deadline, and the symptom is a FALSE FAIL on a
  # stack that was about to self-heal: hooks take four minutes, the deadline
  # fires around the six-minute mark, and the deploy is reported broken while
  # the kubelet's next restart would have brought the pod up.
  #
  # 1800s = the 600s hook window `helm --timeout 10m` allows, plus the 600s
  # rollout budget deploy-k8s.sh gives this Deployment, plus 600s of slack for
  # a cold node (image pull, exponential restart backoff capped at 300s). It is
  # a CEILING ON A FALSE FAILURE, not a licence to hang: deploy-k8s.sh's own
  # `rollout status --timeout` is what actually bounds the wait, and it is
  # strictly smaller. Do not lower this below that timeout plus the helm
  # timeout, or the deadline becomes the binding constraint again.
  #
  # NOT SET ON ui OR keycloak, deliberately. Neither waits on a hook: the UI
  # pod is Ready as soon as nginx binds, and Keycloak's own probe budget
  # (30s initial + 30 * 10s) is 330s, comfortably inside the default 600s
  # measured from its own creation. Raising their deadlines would only delay
  # a genuine failure being reported.
  progressDeadlineSeconds: 1800
  # RECREATE, NOT RollingUpdate, AND THE TRADE IS A SHORT OUTAGE ON EVERY
  # UPGRADE IN EXCHANGE FOR NEVER RUNNING TWO GEARS PODS AT ONCE.
  #
  # The bundle is single-instance BY DESIGN -- `gears.replicaCount` above 1 is
  # refused outright a few lines above, because the PVC is ReadWriteOnce and
  # qa-runs ships `NoopLeaderElector`, under which every replica believes it is
  # the leader (DESIGN §3.4). `replicas: 1` does NOT deliver that on its own:
  # Kubernetes' default RollingUpdate at one replica is maxSurge 1 /
  # maxUnavailable 0, so the NEW pod must be Ready BEFORE the old one is
  # deleted. For that window -- which here is not brief, since this pod waits
  # on hooks and a database -- two gears processes run side by side, both
  # believing they are the leader, both running the dispatcher, scheduler and
  # referential-check tickers.
  #
  # OBSERVED on the dev stand as duplicate log lines during an upgrade. The
  # duplication is bounded (the tickers' own database-side guards -- the unique
  # index on `qa_schedule_ticks`, the queue lease -- stop a doubled tick from
  # becoming a doubled RUN), which is why it showed up as noise rather than as
  # a second execution. Bounded is not the same as absent, and the guard above
  # says two pods are unsafe; a strategy that runs two anyway contradicts it.
  #
  # WHAT THIS COSTS, stated plainly because it is a real cost and not a
  # rounding error. Recreate deletes the old pod first, so the gears are DOWN
  # from that delete until the new pod is Ready -- the API, and every open SSE
  # log stream with it. A client following a run's logs sees the stream end and
  # must reconnect; the stream does not resume itself. On a single-node dev
  # stack with one replica there is no highly-available path to protect and
  # nothing to fail over to, so this buys correctness with downtime that a
  # rolling update was only ever pretending to avoid: with maxUnavailable 0 and
  # a pod that cannot go Ready until its hooks finish, the "rolling" window was
  # an overlap, not a continuity.
  #
  # DO NOT substitute maxUnavailable: 1 on a RollingUpdate. It produces the
  # same delete-then-create ordering with more moving parts, and it leaves the
  # overlap reachable again the moment anyone raises replicaCount -- which the
  # guard above already refuses, but defence in depth is the point.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "qa-platform.selectorLabels" (dict "root" $ "component" "gears") | nindent 6 }}
  template:
    metadata:
      annotations:
{{/* THE CONFIG CHECKSUMS, and the defect they close.

     A ConfigMap is not part of a Deployment's pod template, so changing one
     changes nothing Kubernetes can see: `helm upgrade` writes the new
     ConfigMap, reports success, and the running pod keeps serving the OLD
     values out of memory until something unrelated restarts it. MEASURED on
     the dev stand 2026-09-21: `helm upgrade --reuse-values --set
     bundleDownloadSigningSecret=...` produced revision 29 with the new value
     in `qa-platform-gears-config`, and the gears pod was still 38 minutes old
     afterwards, still signing bundles with the previous key. The operator has
     no signal at all -- helm said OK and the manifest says the new value.
     That is true of EVERY value this chart renders into these objects, not
     just that one; the signing secret is only where it was noticed, because
     there the stale value produces a 403 rather than merely stale behaviour.

     Hashing the rendered template into a pod annotation is what makes the
     change visible: the annotation is part of the pod template, so a changed
     ConfigMap is a changed PodSpec and Kubernetes rolls the Deployment
     itself. `include` re-renders the template with this same root context, so
     the hash is over exactly what the ConfigMap object will contain.

     WHAT IT COSTS, said here so nobody is surprised by it. This Deployment is
     `strategy: Recreate` (see the comment on it above), so a config-triggered
     roll deletes the pod before creating the new one: the API is DOWN for the
     restart, and every open SSE log stream ends. That is the accepted
     trade-off -- the alternative is not "no outage", it is "the new config
     does not apply and nothing says so", which is how this defect was found.

     THE RENDERED TEMPLATE MUST BE DETERMINISTIC FOR THIS TO BE USEFUL, and
     that is why `gears-config-configmap.yaml`'s two signing secrets are
     `required` rather than defaulting to `randAlphaNum 32`. With a per-render
     random in there, this hash would differ on every render, and every `helm
     upgrade` -- including one that changes nothing -- would roll the pod and
     take the Recreate outage for no reason. `check_config_rollout.py` asserts
     both halves: that two identical renders agree, and that changing a value
     changes the hash.

     `qa-platform-tls` IS DELIBERATELY NOT HERE. It is not a template: the
     certs Job (certs-job.yaml) creates and refreshes that Secret inside the
     cluster, so there is nothing for `include` to render and its contents are
     not knowable at render time. The gears mount only `ca.crt` from it and
     read it at start-up; rotating it is that Job's business, not this
     annotation's. */}}
        checksum/gears-config: {{ include (print $.Template.BasePath "/gears-config-configmap.yaml") . | sha256sum }}
        checksum/gears-argo-config: {{ include (print $.Template.BasePath "/gears-argo-configmaps.yaml") . | sha256sum }}
        checksum/postgres-secret: {{ include (print $.Template.BasePath "/postgres-secret.yaml") . | sha256sum }}
{{/* The annotation-based scrape convention, and the only reason it is
     annotations rather than a ServiceMonitor: this cluster has no Prometheus
     Operator, so `monitoring.coreos.com/v1` is not a kind that can be created
     here (measured on the dev stand 2026-09-18 -- 12 CRDs, none of them
     monitoring's). Nothing in this cluster reads these today either; they are
     three inert lines that start working the day a scraper is installed,
     against an endpoint that is already answering.

     GATED ON THE SAME VALUE AS THE ENDPOINT ITSELF. An annotation promising a
     scrape target on a pod that is not listening is worse than no annotation:
     it is a scraper's permanent `connection refused` with no error on this
     side. */}}
{{- if .Values.opentelemetry.metrics.scrape.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.gears.metricsPort | quote }}
        prometheus.io/path: "/metrics"
{{- end }}
      labels:
        {{- include "qa-platform.selectorLabels" (dict "root" $ "component" "gears") | nindent 8 }}
    spec:
      serviceAccountName: qa-platform-gears
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
{{/* Gated on BOTH enabled AND a non-empty uiServiceClusterIP, not `required`
     on the latter alone. deploy-k8s.sh's two-pass install (Task 11) depends
     on this rendering with NO hostAliases block when uiServiceClusterIP is
     still "" -- pass 1 has to succeed and create the qa-platform-ui Service
     before anything can read its ClusterIP, and pass 2 supplies it. A
     `required` on uiServiceClusterIP made pass 1 itself fail at render
     (Helm's `required` treats "" as missing, same trap Task 5 already hit on
     keycloakRealmJson), which is a chart-level deadlock: the block that
     needs the IP would block the very install step that produces it. See
     NOTES.txt for the operator-facing warning this trade costs -- enabling
     hostAliases without ever supplying uiServiceClusterIP now silently
     renders no hostAliases at all instead of failing loudly. */}}
{{- if and .Values.gears.hostAliases.enabled .Values.uiServiceClusterIP }}
      hostAliases:
        - ip: {{ .Values.uiServiceClusterIP }}
          hostnames: [{{ include "qa-platform.publicHost" . | quote }}]
{{- end }}
      containers:
        - name: gears
          image: "{{ .Values.images.gears.repository }}:{{ .Values.images.gears.tag }}"
          imagePullPolicy: {{ .Values.images.gears.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gears.port }}
{{/* The scrape listener (libs/toolkit's telemetry::scrape), NOT a second way
     into the API. It serves one route, `/metrics`, on its own socket; the
     api-gateway's router and its auth middleware are on `http` above and are
     not involved. Declared only when the gears are actually listening, so
     `kubectl get pod -o wide` never advertises a port nothing bound. */}}
{{- if .Values.opentelemetry.metrics.scrape.enabled }}
            - name: metrics
              containerPort: {{ .Values.gears.metricsPort }}
{{- end }}
          env:
            - name: POSTGRES_HOST
              value: qa-platform-postgres
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: qa-platform-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qa-platform-postgres
                  key: POSTGRES_PASSWORD
            # THE BARE ORIGIN, deliberately not the qa-platform.issuer helper.
            # entrypoint.sh:137 validates this against `^https?://host[:port]$`
            # and appends `/realms/qa-platform` itself when building
            # issuer_pattern -- a value already carrying that suffix (what
            # qa-platform.issuer produces, for the UI build arg and
            # verification checks) fails that regex and the container refuses
            # to start.
            - name: PUBLIC_ISSUER_ORIGIN
              value: {{ required "publicOrigin is required -- set it with --set publicOrigin=https://host" .Values.publicOrigin | quote }}
            - name: QA_RUNS_ARGO_CONFIG
              value: /etc/qa-platform/qa-runs-argo.yaml
            - name: QA_ENVIRONMENTS_ARGO_CONFIG
              value: /etc/qa-platform/qa-environments-argo.yaml
            - name: RUST_LOG
              value: {{ .Values.gears.logLevel | quote }}
          volumeMounts:
            - name: config
              mountPath: /etc/cf-gears
              readOnly: true
            - name: argo-qa-runs
              mountPath: /etc/qa-platform/qa-runs-argo.yaml
              subPath: qa-runs-argo.yaml
              readOnly: true
            - name: argo-qa-environments
              mountPath: /etc/qa-platform/qa-environments-argo.yaml
              subPath: qa-environments-argo.yaml
              readOnly: true
            - name: data
              mountPath: /var/lib/cf-gears/data
            # ca.crt only, never keycloak.crt/keycloak.key or ca.key -- the
            # Secret's `items` list below projects exactly this one key into
            # the directory, so the private material never appears in this
            # container's filesystem at all.
            - name: tls-ca
              mountPath: /etc/keycloak-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
      volumes:
        - name: config
          configMap:
            name: qa-platform-gears-config
        - name: argo-qa-runs
          configMap:
            name: qa-platform-gears-argo-qa-runs
        - name: argo-qa-environments
          configMap:
            name: qa-platform-gears-argo-qa-environments
        - name: data
          persistentVolumeClaim:
            claimName: qa-platform-gears-data
        - name: tls-ca
          secret:
            secretName: qa-platform-tls
            items:
              - key: ca.crt
                path: ca.crt
