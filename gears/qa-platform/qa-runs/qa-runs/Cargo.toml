[package]
name = "qa-runs"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

# `cluster-sdk` is a deliberate declared-but-unused dependency: it is the
# intended long-term home for `infra::leader` once a `ClusterProfile` is bound,
# and Step 5 of the plan directs keeping it as the marker. `cargo shear
# --deny-warnings` flags it, and CI's `shear` job fails.
#
# Scoped **here** rather than added to `[workspace.metadata.cargo-shear]
# ignored`: that list's own comment says it holds gear crates consumed only by
# `#[toolkit::gear(deps = [...])]`'s macro-generated re-exports. `cluster-sdk`
# is not in this gear's `deps` and is not consumed at all, so listing it there
# would file it under a reason that does not apply to it.
# `testcontainers`/`testcontainers-modules` are declared as *optional* entries
# under `[dependencies]` rather than `[dev-dependencies]` because Cargo does not
# allow optional dev-dependencies, and the `integration` feature must name them
# via `dep:`. That placement is what keeps a default `cargo test` from building
# them at all. `cargo-shear`'s "misplaced optional dependency" heuristic flags
# it; the placement is required, not accidental. Shape copied from
# `gears/system/cluster/plugins/postgres-cluster-plugin`.
#
# **Not verified here:** `cargo-shear` is not installed on this machine, so
# whether these entries actually silence it is unmeasured.
[package.metadata.cargo-shear]
ignored = ["cluster-sdk", "testcontainers", "testcontainers-modules"]

[features]
# Gates the real-Postgres integration tier so a default `cargo test` never needs
# a Docker daemon. The unit tier is in-memory `SQLite`, which serializes every
# writer, so the multi-connection races in `domain::service::ingest` cannot be
# falsified there with *or* without a fix — that is what this tier exists for.
#
# The tests live in-lib (`domain::service::ingest_races_pg_tests`,
# `infra::storage::isolation_pg_tests`) rather than in `tests/`, because they
# need `pub(crate)` services and the `#[cfg(test)]` fixtures -- so the run
# command is `--lib`, not `--test`:
#   cargo test -p qa-runs --features integration --lib
#
# CI runs these, on the `integration` job, via `make test-qa-runs-pg` -- the
# same shape `test-users-info-pg`, `test-usage-collector-pg` and
# `test-cluster-pg` use, all of which stand their own containers up through
# testcontainers. They are the only guards that can falsify the SERIALIZABLE
# escalation in `domain::service::ingest`, so running them only on a
# developer's machine would have left that change effectively unguarded.
#
# A *default* `cargo test` still needs no Docker, which is what the feature gate
# buys: the ordinary test job (`make test-no-macros`) passes no
# `--all-features`, so it neither builds nor runs any of this. The lint job is
# not exempt from *building* it, though -- `make clippy` does pass
# `--all-features`, so `testcontainers` is compiled there even though no
# container is ever started. No shipped
# artifact is affected either -- every consumer of these two crates is behind
# `#[cfg(all(test, feature = "integration"))]`.
integration = ["dep:testcontainers", "dep:testcontainers-modules"]

# The Argo Workflows execution adapter (`infra::executor::argo`).
#
# **Off by default, and that is the whole point of the feature.** ADR-0001 chose
# the platform serverless runtime precisely to remove Kubernetes from the
# product, and its Confirmation criterion is "no `kube`/`k8s-openapi` in any
# qa-platform crate". The waiver recorded in that ADR
# (`docs/ADR/0001-cpt-cf-qa-adr-serverless-execution.md`, "Waiver, 2026-08-27")
# permits this adapter *only* behind a non-default feature, so a default build
# of this crate — and therefore of every qa-platform crate — still has no
# Kubernetes dependency in its tree. Verify with:
#   cargo tree -p qa-runs -i kube -e normal          # "nothing to print"
#   cargo tree -p qa-runs --features argo -i kube -e normal
#
# `-e normal` is load-bearing since the product-plugin branch. Without it the
# first command succeeds and prints `kube -> qa-plugin-k8s ->
# qa-vhp-product-plugin -> [dev-dependencies] -> qa-runs`: a DEV edge, which
# ships in nothing and is not what ADR-0001's criterion is about. `-e normal`
# restricts the query to the edges a released binary actually has.
#
# The four extra crates and why each is needed:
#
# * `kube` — the API client. `client` for HTTP, `rustls-tls`/`aws-lc-rs` for
#   TLS (matching `chat-engine`'s `k8s` feature, the in-repo precedent), and
#   `runtime` because pod log following uses `Api::log_stream`.
# * `k8s-openapi` — only for `core::v1::Pod`, which pod discovery and log
#   reading need. The `Workflow` CR itself is a `DynamicObject`, so no
#   generated Argo types are involved (the source system does the same,
#   `manager/src/services/argo.rs:17-30`).
# * `regex` — the runner's log-marker grammar
#   (`manager/src/services/argo.rs:2736-2996`).
# * `base64` — `=== TEST_CASE: <base64-json> ===` markers (`argo.rs:2921`).
#
# `tower`, `http-body` and `bytes` — `watch`'s own `#[cfg(test)]` module's
# loopback `kube::Client` doubles (Task 17, review findings #20/#21; see that
# module's doc for what they build and why `qa-plugin-k8s`'s own stub server
# could not be reused as-is) — are **not** here. Fix round 1 moved them to
# `[dev-dependencies]` below: a dev-dependency never ships, so it does not
# need to be optional or named in this feature at all, and every real use of
# all three is confined to `argo/watch.rs`'s `#[cfg(test)] mod tests` (the
# module itself gated on this same `argo` feature). The first version put
# them here on the reasoning "Cargo does not allow optional dev-dependencies"
# — true, but the wrong conclusion: that rule only bites a dependency that
# *needs* to be optional, and a dev-dependency's whole point is that it never
# ships, so there was nothing to make optional in the first place.
argo = ["dep:kube", "dep:k8s-openapi", "dep:regex", "dep:base64"]

[dependencies]
qa-runs-sdk = { path = "../qa-runs-sdk" }

authz-resolver-sdk = { package = "cf-gears-authz-resolver-sdk", path = "../../../system/authz-resolver/authz-resolver-sdk" }
authz-resolver = { workspace = true }

# Cross-gear SDKs this gear consumes (ClientHub).
# Intra-subsystem siblings go by relative path, matching qa-catalog's own
# `qa-catalog-sdk = { path = "../qa-catalog-sdk" }` — neither has a
# [workspace.dependencies] entry, so `{ workspace = true }` would not resolve.
qa-catalog-sdk = { path = "../../qa-catalog/qa-catalog-sdk" }
qa-environments-sdk = { path = "../../qa-environments/qa-environments-sdk" }

# The product-plugin contract. This gear consumes only the **access** half —
# `RunAccess`, `MountSpec`, `RunnerSpec`, re-exported from
# `domain::ports::run_executor`, which is the port `KubeconfigMount`
# generalised into (spec §5.2, §7). It never resolves a plugin itself: the
# resolver is qa-catalog's, and dispatch reaches it through that gear's client.
#
# Carries no Kubernetes dependency, so ADR-0001's containment is unaffected —
# `qa-product-sdk` depends on nothing in qa-platform (plan, "New crates").
qa-product-sdk = { path = "../../qa-product-sdk" }

# The two sibling **gear crates**, not just their SDKs.
#
# Required by `deps = [qa_catalog, qa_environments]` in `#[toolkit::gear]`,
# which resolves each token against a crate ident. The SDK is what this gear
# *calls*; the gear crate is what the token needs, exactly as qa-catalog
# depends on the `credstore` crate for its own `deps = [credstore]`.
#
# **They are there for initialisation order, which is the part the plan got
# wrong.** Cross-gear clients do come from `ClientHub` whether or not a token
# is declared - but `ClientHub::get` at init time only finds a client the other
# gear has already registered, and `deps` is what puts that gear earlier in the
# topological order. Without these two, the boot log ordered qa-runs *before*
# qa-catalog and init failed with `client not found: type=dyn
# qa_catalog_sdk::client::QaCatalogClientV1`. Measured, 2026-08-15.
#
# Both are also listed in `[workspace.metadata.cargo-shear] ignored`: the
# macro's re-exports are invisible to `cargo-shear`, so it flags them unused.
qa-catalog = { path = "../../qa-catalog/qa-catalog" }
qa-environments = { path = "../../qa-environments/qa-environments" }
cluster-sdk = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true, features = ["time"] }
axum = { workspace = true, features = ["macros"] }
# The SSE relay's stream combinators (`api::rest::handlers::runs`).
futures = { workspace = true }
http = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
# `runvars::base_domain_from_url` — derives `VPADM_BASE_DOMAIN` from a
# platform's `vhp_base_url`, ported from `manager/src/services/argo.rs:2476`.
# Not Kubernetes-related, so it stays outside the `argo` feature gate.
url = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }

# The metric instruments `infra::metrics` holds — `Counter`, `Histogram`, the
# `Meter` they are built from, and the process-global meter provider
# `build_default_adapter` reads. Only the API crate: the SDK (providers,
# exporters, readers) is the *pipeline's* concern and `libs/toolkit`'s
# `telemetry::init` owns it, so a gear that never configures a pipeline is
# still fully instrumented and every instrument it builds is a no-op. Same
# split `account-management`'s Cargo.toml makes.
opentelemetry = { workspace = true }

toolkit = { workspace = true }
toolkit-db = { workspace = true, features = ["sqlite", "pg"] }
toolkit-db-macros = { workspace = true }
toolkit-security = { workspace = true }
toolkit-canonical-errors = { workspace = true, features = ["axum", "utoipa"] }
toolkit-macros = { workspace = true }
# Cursor pagination and `$filter` on the runs and queue collections
# (`infra::storage::odata`). `with-utoipa` is what gives `Page<T>` a schema, so
# a paginated response can be registered with `json_response_with_schema`.
toolkit-odata = { workspace = true, features = ["with-utoipa"] }
# Link-time GTS permission catalog (`src/gts/permissions.rs`): declares
# AuthzPermissionV1 instances into the toolkit-gts inventory the
# types-registry aggregates at boot.
toolkit-gts = { workspace = true }
# `gts_id!`'s upstream validation (`GtsIdPattern`) and `GTS_ID_PREFIX`, which
# `toolkit-gts`'s macros delegate to. Same pairing qa-catalog's,
# qa-environments' and qa-insights' Cargo.toml carry.
gts = { workspace = true }

# The real-Postgres integration tier's container bring-up
# (`infra::storage::test_db::pg_db`).
# Optional, and pulled in only by `--features integration`; see the `[features]`
# doc above for why these are here rather than in `[dev-dependencies]`.
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }

# Cron evaluation (Phase B schedules).
cron = { workspace = true }
# **Only because `cron` is built on `chrono` and this gear is built on `time`.**
# `cron::Schedule`'s whole datetime surface — `after`, `includes` — speaks
# `chrono::DateTime`, so evaluating a schedule means naming that type. Added by
# Task 18, which confines it to `domain::cron`'s private interior; no signature
# this crate exports mentions it, and `time::OffsetDateTime` remains the only
# instant type in the domain, the SDK models and the schema.
#
# No new build cost: `cron` already depends on `chrono` with `clock`, so this
# adds a name, not a crate.
chrono = { workspace = true }
# Lifecycle background tasks — dispatcher loop, timeout sweeper
# (CancellationToken; see `gear::serve`).
tokio-util = { workspace = true }

# ── The `argo` feature's dependencies, all optional ──────────────────────────
# See the `[features]` note above for why they are optional and what each is
# for. Feature set on `kube` mirrors `gears/chat-engine/chat-engine/Cargo.toml`
# (`k8s`), plus `runtime` for `Api::log_stream`.
kube = { workspace = true, features = [
    "client",
    "runtime",
    "rustls-tls",
    "aws-lc-rs",
], optional = true }
k8s-openapi = { workspace = true, features = ["latest"], optional = true }
regex = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
# `Problem::from_error_debug` moved behind this feature in the new
# toolkit-canonical-errors. `domain::error`'s drift guard asserts the debug
# renderer leaks nothing either, so the test tier needs it -- and only the
# test tier: a production build never enables it.
toolkit-canonical-errors = { workspace = true, features = ["debug-problem"] }
# The in-memory metric exporter (`InMemoryMetricExporter`) the adapter's tests
# and the two call-site tests read their series back from — it lives behind
# `opentelemetry_sdk`'s `testing` feature.
#
# **Declared here rather than inherited.** `libs/toolkit-http` enables the same
# feature, and under a plain workspace build Cargo's feature unification would
# hand it to this crate for free — but that unification does not hold under
# `cargo build -p qa-runs` or under `cargo hack --each-feature`, both of which
# are green gates on this branch. A dependency this crate's own tests name is a
# dependency this crate declares.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# For `infra::executor::argo::watch`'s own loopback `kube::Client` doubles
# (Task 17, fix round 1) — see the `[features]` note's `argo` entry for why
# these live here rather than as optional entries in `[dependencies]`. Never
# ships: real use is confined to that module's `#[cfg(test)]`, itself gated on
# the non-default `argo` feature, so a default `cargo test` builds neither the
# module nor these three. `util` is the feature `tower::service_fn` lives
# behind.
tower = { workspace = true, features = ["util"] }
http-body = { workspace = true }
bytes = { workspace = true }
# Log-output assertions. Several guarantees in this crate are discharged by a
# `tracing` event and nothing else — the frozen guide's mandatory expiry alert,
# `lease_occupancy`'s fail-closed ERROR, and the dispatcher's one-WARN-per-pass
# denial notice — and before this dependency existed no test could observe any
# of them, so mutating the emission away left the suite green.
#
# `tracing-test` rather than a hand-rolled `tracing-subscriber` layer: every
# test in this crate is a `#[cfg(test)]` unit test inside the lib, which is the
# shape `tracing-test`'s thread-local capture is built for, and it is what the
# other in-lib log assertions in this workspace use
# (`account-management/src/domain/tenant/service/service_tests.rs`,
# `cluster/src/defaults/guard.rs`, `toolkit/src/api/canonical_error_layer.rs`).
# `tracing-subscriber` with a custom layer is the workspace's idiom for
# `tests/`-directory integration tests instead (`api-gateway/tests/`).
#
# `no-env-filter` for the reason account-management gives: the default
# `{crate}=trace` filter would drop events whose target is not this crate.
tracing-test = { workspace = true, features = ["no-env-filter"] }
# The **real** VHP product plugin, for the golden `RunSpec` test alone.
#
# A dev-dependency, and a deliberate one. `golden_run_spec_tests` exists to
# prove that the VHP RunSpec did not move when dispatch started going through
# the plugin, and a double that reproduced VHP's four variable names and its
# mount path would prove only that the double agrees with itself — the exact
# defect the Phase D review found in qa-catalog's `products_tests`. So that one
# test drives the real crate.
#
# Production code here names no product and must not: the resolver is
# qa-catalog's, reached through the `ClientHub` (`infra::product_plugin`), and
# nothing in `[dependencies]` mentions a plugin. That is what keeps this edge a
# test fixture rather than an architecture change.
#
# ADR-0001, measured rather than asserted. This plugin links `qa-plugin-k8s`,
# so `cargo tree -p qa-runs -i kube` now shows a path into this crate — and the
# tree itself labels it `[dev-dependencies]`. Restricted to real edges it is
# unchanged:
#
#   cargo tree -p qa-runs -i kube -e normal                 -> nothing to print
#   cargo tree -p qa-runs -i kube -e normal --features argo -> kube -> qa-runs
#
# The second is the pre-existing `argo` adapter, which ADR-0001's 2026-08-27
# waiver covers and this plan does not remove (design §4.1's Correction states
# the same). No Kubernetes type reaches a shipped `qa-runs` binary because of
# this line; add `-e normal` when checking containment here.
qa-vhp-product-plugin = { path = "../../plugins/qa-vhp-product-plugin" }
# `SecretValue`, for the one test that builds a `MountSpec::ConfigValue` — the
# mount variant this executor refuses to render.
#
# A **dev**-dependency deliberately. This gear never resolves credential
# plaintext: it passes credstore *references* through to the execution plane
# (spec §5.2, ruling D-19), and `prepare_run_access` is required to work from a
# reference alone. Keeping the type out of `[dependencies]` means production
# code here cannot construct one even by accident.
credstore-sdk = { workspace = true }
# The encoding axum's `Query` extractor uses, so the queue read's query struct
# can be driven without building a request (`api::rest::dto`).
serde_urlencoded = { workspace = true }
