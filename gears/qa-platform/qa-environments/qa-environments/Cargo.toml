[package]
name = "qa-environments"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[package.metadata.cargo-shear]
ignored = ["testcontainers", "testcontainers-modules"]

[features]
default = []

# Finding #94's pod-bound runner credentials (`infra::pod_identity`): a
# `TokenReview` of the runner pod's projected ServiceAccount token, then a
# `GET pod` whose uid must equal the reviewed one. Off by default (ADR-0001):
# a default build carries no Kubernetes client at all.
# * `kube` -- `client` + `rustls-tls`; no `runtime`: nothing here watches.
# * `k8s-openapi` -- `authentication.k8s.io/v1::TokenReview`, `core::v1::Pod`.
runner-credentials = ["dep:kube", "dep:k8s-openapi"]
# Gates the real-Postgres tier (Docker required; `test_support::pg_db` starts one
# container per test). The unit tier is in-memory SQLite with one connection, so
# two writers of one variable can never overlap there, with a fix or without one.
# `infra::storage::variables_pg_tests` is the only test that can falsify the
# concurrent-upsert behaviour of `PUT /qa/v1/variables` (DESIGN §3.2). Run with
# `make test-qa-environments-pg`.
postgres = ["dep:testcontainers", "dep:testcontainers-modules"]

[dependencies]
qa-environments-sdk = { path = "../qa-environments-sdk" }
# The observation contract: `ObservedAttrs` and `HealthState` are what the
# `observed_attrs` and `health_state` columns hold, read back through
# `infra::storage::mapper`. Kube-free and depends on nothing in qa-platform,
# so ADR-0001's containment is unaffected (`cargo tree -p qa-environments -i kube`).
qa-product-sdk = { path = "../../qa-product-sdk" }
# `QaProductPluginResolverV1` only: the one capability this gear needs from
# qa-catalog, resolved from the `ClientHub` at observation time rather than at
# `init` (see `infra::product_plugin`). Not a `deps = [...]` gear token --
# qa-catalog is not required for this gear to BOOT, only to observe.
qa-catalog-sdk = { path = "../../qa-catalog/qa-catalog-sdk" }
# `QaRunsClientV1::resolve_runner_pod` only (`infra::runner_pod_resolver`),
# resolved from the `ClientHub` per call, never at `init`: qa-runs declares
# `deps = [qa_environments]`, so the reverse `deps` token would be a cycle.
# The SDK is kube-free, so ADR-0001's containment is unaffected.
qa-runs-sdk = { path = "../../qa-runs/qa-runs-sdk" }

authz-resolver-sdk = { package = "cf-gears-authz-resolver-sdk", path = "../../../system/authz-resolver/authz-resolver-sdk" }
authz-resolver = { workspace = true }
# The credstore gear crate itself (not just its SDK): the `deps = [credstore]`
# declaration in `#[toolkit::gear]` resolves the dependency token against the
# crate ident (same pattern as `authz-resolver` above; precedent: qa-catalog).
credstore = { workspace = true }
credstore-sdk = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true, features = ["time"] }
axum = { workspace = true, features = ["macros"] }
http = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }

# The metric instruments `infra::metrics::QaEnvironmentsMetricsMeter` holds,
# and the process-global meter provider `build_default_adapter` reads. Only the
# `Counter`/`Histogram`/`Meter` surface and `global::meter_with_scope` are used;
# the SDK itself (`opentelemetry_sdk`) is a dev-dependency, because a gear emits
# into whatever pipeline `toolkit`'s telemetry init installed and never builds
# one. Pulls no Kubernetes in, so ADR-0001's containment is unaffected
# (`containment_tests` is the assertion).
opentelemetry = { workspace = true }

toolkit = { workspace = true }
toolkit-db = { workspace = true, features = ["sqlite", "pg"] }
toolkit-db-macros = { workspace = true }
# `Page`/`PageInfo` on the paginated collection reads, and the `FilterField`
# allow-list `infra::storage::odata` implements. `with-utoipa` because the
# routes register `Page<EnvironmentDto>` as an OpenAPI component -- same
# feature qa-runs and qa-insights enable, for the same reason.
toolkit-odata = { workspace = true, features = ["with-utoipa"] }
toolkit-security = { workspace = true }
toolkit-canonical-errors = { workspace = true, features = ["axum", "utoipa"] }
toolkit-macros = { workspace = true }
# Link-time GTS content: the permission catalog (`src/gts/permissions.rs`)
# declares AuthzPermissionV1 instances, and `src/gts/authz_types.rs` declares
# the stub `#[gts_type_schema]` types for this gear's authz labels, into the
# toolkit-gts inventory the types-registry aggregates at boot.
toolkit-gts = { workspace = true }
# `gts_id!`'s upstream validation (`GtsIdPattern`) and `GTS_ID_PREFIX`, which
# `toolkit-gts`'s macros delegate to.
gts = { workspace = true }
# The runtime JSON-Schema reflection backend `#[gts_type_schema]` generates
# code against (`src/gts/authz_types.rs`). Same pairing account-management-sdk
# and qa-product-sdk's Cargo.toml carry alongside `toolkit-gts`.
schemars = { workspace = true }
# `POST /qa/v1/runner-credentials` answers each file's bytes as `content_b64`
# (`api::rest::dto::RunnerFileDto`).
base64 = { workspace = true }

# ── The `runner-credentials` feature's dependencies, all optional ─────────────
kube = { workspace = true, features = ["client", "rustls-tls", "aws-lc-rs"], optional = true }
k8s-openapi = { workspace = true, features = ["latest"], optional = true }

# Only under `--features postgres`; see `[features]`. Same placement as
# qa-catalog, qa-insights and qa-runs (Cargo has no optional dev-dependencies).
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }

[dev-dependencies]
# `test-util` for `tokio::time::pause`: the runner-credential route's deadline
# test drives a verifier that never answers on a paused clock, so it proves
# the 30 s bound without waiting 30 s.
tokio = { workspace = true, features = ["test-util"] }
# The in-memory metric pipeline `infra::metrics::probe` builds: an adapter test
# has to read back what was really exported, and the SDK is the only thing that
# can produce that. Declared here rather than relied on through feature
# unification with a sibling crate -- `cargo hack --each-feature` builds this
# package on its own, where unification would not save it.
opentelemetry_sdk = { workspace = true, features = ["testing"] }

# `Canary::vhp_shaped()` -- the three planted credential shapes the plugin
# SDK's own leak harness uses. The observation tests plant it in the credential
# material a fake plugin is handed and assert it reaches neither
# `observed_attrs` nor `health_detail`, so using the harness's own markers
# rather than a hand-rolled string keeps the two suites testing the same thing.
qa-product-sdk = { path = "../../qa-product-sdk", features = ["test-util"] }

# Parses a config document in the format it really arrives in, so
# `config::observation_config_tests` can pin that an `--argo` deployment's
# YAML deserializes in a build WITHOUT `runner-credentials` too (the
# `deny_unknown_fields` + feature-gated-field trap). A JSON stand-in would exercise the same serde attributes but not
# the same document.
serde_yaml = { workspace = true }

# Captures the RAW `tracing` output inside a test, so "the kubeconfig never
# reaches a log line" is asserted against what was really emitted.
#
# `tracing-test` (the usual choice here, e.g. gears/system/account-management)
# is deliberately NOT used for this: it keeps only captured lines that contain
# the test's span name, so a multi-line field value — which is exactly the
# shape a leaked kubeconfig has — survives capture only as its FIRST line. A
# leak on any later line reads as "no leak". Measured: with a deliberate
# `info!(document = %material.expose())` in `write_generated_secret`, a
# `tracing-test` assertion on the canary PASSED. A plain buffer does not have
# that hole.
tracing-subscriber = { workspace = true }
