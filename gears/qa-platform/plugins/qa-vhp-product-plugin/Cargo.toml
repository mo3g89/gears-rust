[package]
name = "qa-vhp-product-plugin"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The QA Platform product plugin for Virtuozzo Hybrid Platform: its credential and observed schemas, the frozen vpadm install-topology detection rules, and the observation that reads them off a live cluster"

[lints]
workspace = true

[dependencies]
qa-product-sdk = { path = "../../qa-product-sdk" }
# ADR-0001: `kube`/`k8s-openapi` are named in exactly one crate in this
# workspace, and this is not it. Every Kubernetes read below goes through
# `qa-plugin-k8s`'s `KubeClient`, and every failure through its classifier —
# which is also why nothing here can format an upstream error even by
# accident: `PluginFailure::detail` is `&'static str`.
qa-plugin-k8s = { path = "../qa-plugin-k8s" }
async-trait = { workspace = true }
# `serde::Deserialize` for one `vp-gateway-hostnames` entry, and
# `serde_json::from_str` to read it. `serde_json::Value` is also how the
# environment's non-secret configuration arrives on `EnvironmentHandle`.
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `url::Url`, for the one derivation in `run.rs`: `VPADM_BASE_DOMAIN` is the
# bare host of the observed base URL. Behaviour is copied from
# `qa-runs::domain::runvars::base_domain_from_url`, which delegates to this
# crate rather than splitting on `/` so IPv6 literals, userinfo and IDN hosts
# come out right — so the copy delegates to it too.
url = { workspace = true }

# ── The gear (`gear.rs`) and nothing else ─────────────────────────────────────
#
# `toolkit` for the `#[toolkit::gear]` macro, `GearCtx` and `ClientHub`;
# `types-registry-sdk` for the client the GTS instance is published through;
# `types-registry` because `deps = [types_registry]` expands to a re-export of
# that crate, which is what forces its own inventory registration to survive
# linking; `inventory` because the macro submits through it; `anyhow` for the
# `init` error type the `Gear` trait names. None of them reaches `kube`
# (ADR-0001): the only edge to it in this crate's graph is `qa-plugin-k8s`.
toolkit = { workspace = true }
types-registry-sdk = { workspace = true }
types-registry = { workspace = true }
inventory = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# `SecretValue`, to build the resolved `CredentialSlot`s `observe` is driven
# with. Not a runtime dependency: the plugin's own code never names the type,
# it only passes what `EnvironmentHandle::resolved` hands it straight to
# `qa-plugin-k8s`.
credstore-sdk = { workspace = true }
# `qa-plugin-k8s`' API-server doubles: the route-table `KubeClient`
# constructor the `ConfigMap` fall-through tests drive, and the loopback stub
# server whose kubeconfig makes `KubeClient::from_kubeconfig` *succeed* — which
# is what puts `assert_no_leak` on this plugin's success path instead of
# leaving it at the client build. They live in that crate rather than here
# because ADR-0001 keeps `kube::Client::new` out of this one; nothing in the
# doubles' signatures names a `kube` type.
qa-plugin-k8s = { path = "../qa-plugin-k8s", features = ["test-support"] }
# `qa_product_sdk::testing::assert_no_leak` — Layer 3 of the leak defence —
# lives behind the SDK's `test-util` feature, so this crate's own test suite
# has to ask for it. A production build of this plugin does not compile the
# harness.
qa-product-sdk = { path = "../../qa-product-sdk", features = ["test-util"] }
# Builds the subscriber the two `warn!`-site tests install. What it writes
# into is `qa_plugin_k8s::test_support::RawBuffer`, which records why
# `tracing-test` is the wrong capture for a leak assertion.
tracing-subscriber = { workspace = true }
