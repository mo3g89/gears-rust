# ---------------------------------------------------------------------------
# Test-only
# ---------------------------------------------------------------------------
[dev-dependencies]
# `tokio` is **not** here. It lived in this section from Task 10 (the migration
# module's schema tests' `#[tokio::test]`) until Task 39 promoted it to
# `[dependencies]` proper — see that entry for why — and the redundant
# `[dev-dependencies]` line survived alongside it for one commit longer than it
# was true. Removed in Phase C's final review.
#
# `sea-orm` was deliberately **not** added alongside `tokio` at Task 10:
# `sea-orm-migration` re-exports the whole crate as `sea_orm_migration::sea_orm`,
# and the schema tests reach `Database`, `ConnectOptions`, `DatabaseConnection`
# and `Statement` through that re-export. **Task 11 added the direct
# `[dependencies]` entry**, because the entity derives need it.

# `event-broker-sdk` (with `features = ["db", "test-util"]`, for `MockBroker`
# and `MockBrokerHandle`) and `chrono` (for the mock broker's
# `Event::occurred_at`, a `chrono::DateTime<Utc>`) lived here from Task 13 for
# the transactional consumer's tests. No deployment ever registered the client
# that consumer needed, so it was deleted along with the event-broker
# dependency once that was established (`src/gear.rs`'s header); `time` is and
# remains the only instant type this gear's own domain, schema and SDK use.
# Task 40: `tower::ServiceExt::oneshot`, which is how
# `tests/ingest_idempotence.rs` drives the router `register_rest` returns without
# binding a TCP listener. Test-only by construction — nothing in `src/` names
# `tower` — and the same crate `axum` already builds on, so it adds no new
# dependency tree.
tower = { workspace = true }
# Task 38 of the observability plan: `InMemoryMetricExporter` and
# `SdkMeterProvider`, which `infra::metrics::probe` builds a private pipeline
# out of so an adapter test can read back the series a dashboard would query.
#
# **The `testing` feature is declared here rather than relied on from another
# crate's declaration.** Cargo unifies features across a workspace build, so
# qa-runs' identical entry would silence a missing one on a default `cargo
# test` — and `cargo hack --each-feature`, which is a green gate, builds this
# package on its own, where it would not.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
