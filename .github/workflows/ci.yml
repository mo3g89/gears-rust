name: CI

on:
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # PR CI only ever validates the ephemeral refs/pull/N/merge ref, so without
  # this trigger the integrated tip of main is tested nowhere: a semantic
  # conflict between two PRs merged minutes apart is caught by neither PR's run.
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# NOTE: workflow-level paths-ignore above still skips the entire workflow for
# pure doc/markdown changes.  The per-job path filters below provide finer
# granularity so that, e.g., a Cargo.toml-only change skips FIPS/dylint.

# Concurrency strategy:
# - On pull_request: group by PR number. New commits cancel the in-flight run.
# - On push (main/develop): include run_id so pushes never cancel each other,
#   preventing required CI from silently being dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # We do NOT set RUSTC_WRAPPER globally; we'll enable it per-job after probing sccache.
  # RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: "2G"
  # Usually better determinism and smaller cache churn in CI.
  CARGO_INCREMENTAL: "0"
  # Pinned nightly toolchain used by the coverage job. Independent of the pin in
  # shear-nightly.yml — they happen to match today but need not.
  RUSTUP_TOOLCHAIN_NIGHTLY: nightly-2026-04-16

jobs:
  # ── Change detection ──────────────────────────────────────────────────
  # Lightweight first job that classifies which areas of the repo changed.
  # Downstream jobs use these outputs to skip work that can't be affected.
  # On workflow_dispatch every filter defaults to true (run everything).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust:   ${{ steps.filter.outputs.rust }}
      fips:   ${{ steps.filter.outputs.fips }}
      magika: ${{ steps.filter.outputs.magika }}
      dylint: ${{ steps.filter.outputs.dylint }}
      deps:   ${{ steps.filter.outputs.deps }}
      ci:     ${{ steps.filter.outputs.ci }}
      ui:     ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect changed paths
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              # The lint configuration itself. Without this line the `clippy`
              # job below does not run on a diff that only edits `clippy.toml`
              # -- so widening `disallowed-methods`, raising a complexity
              # threshold or deleting a `disallowed-types` entry lands with the
              # gate that would have judged it never having been asked. The
              # same reasoning as `release-plz.toml` below: a config-only edit
              # must still get the thing it configures run.
              - 'clippy.toml'
              # Input to `make check-release-config` in the test job: a config-only
              # edit must still get the release configuration validated.
              - 'release-plz.toml'
              # Input to `e2e_sidecar_pins_the_same_timescaledb_image` in
              # libs/test-containers: a Python-only edit to the E2E sidecar must
              # still get the cross-lane TimescaleDB pin checked, or the guard
              # silently never runs on exactly the diff it exists to catch.
              - 'testing/e2e/lib/sidecars.py'
            fips:
              - 'libs/toolkit/**'
              - 'libs/toolkit-http/**'
              - 'libs/rustls-*/**'
            magika:
              - 'gears/file-parser/**'
            dylint:
              - 'tools/dylint_lints/**'
            deps:
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
            ci:
              - '.github/workflows/**'
            ui:
              - 'gears/qa-platform/qa-platform-ui/**'
              - 'Makefile'
              # The UI's wire types are generated from this file, so an edit to
              # it must re-run `ui-contract` even when no .ts changed.
              - 'gears/qa-platform/docs/openapi.json'

  # ── Jobs ──────────────────────────────────────────────────────────────

  # Fast clippy: ubuntu only, 2-pass strategy (~5-6 min vs 30-40 min before).
  # Linting output is platform-independent; platform-specific paths (fips) are
  # covered by the test-fips job. Full feature matrix runs nightly (clippy-nightly.yml).
  clippy:
    name: Clippy
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install protoc
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: protoc@3.34.1

      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Install cargo-hack
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: cargo-hack

      - name: Cache Cargo/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-targets: false
          shared-key: pr-clippy-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Probe sccache & set RUSTC_WRAPPER
        shell: bash
        run: |
          if sccache --start-server >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "sccache failed, falling back to plain rustc"
          fi

      # Database image tags are pinned in libs/test-containers (docs/TESTING.md
      # 4.4). A fixture that constructs a container any other way re-introduces
      # the transitive pin through Cargo.lock that issue #4616 removed: a
      # dependency bump then moves the database under every test with nothing in
      # the diff to show it.
      #
      # This parses the workspace with `syn` rather than grepping it, so import
      # renames, type aliases, non-literal image names and creative formatting
      # cannot slip past. Placed here, after the cache and sccache setup, because
      # it needs a toolchain -- but still ahead of clippy, which is the expensive
      # step in this job.
      - name: No unpinned database container images
        run: cargo xtask check-test-container-pins

      - name: cargo clippy
        run: make clippy

  test:
    name: Test Suite (${{ matrix.os }})
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    env:
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Force LF in working tree (w/a for Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install protoc
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: protoc@3.34.1

      - name: Validate gear naming conventions
        run: python3 tools/scripts/validate_gear_names.py

      - name: Validate packaging metadata (readme/license-file paths)
        run: make check-packaging-metadata

      - name: Validate release configuration (publish flags, release-plz.toml)
        run: make check-release-config

      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Install nextest
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: nextest

      # Cache Cargo registry/git + target/ across platforms.
      - name: Cache Cargo/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-targets: false
          shared-key: pr-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      # Install sccache (cross-platform)
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Probe sccache; if startup fails, fall back to plain rustc (no hard CI failure).
      - name: Probe sccache & set RUSTC_WRAPPER
        shell: bash
        run: |
          if sccache --start-server >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "sccache failed, falling back to plain rustc"
          fi

      - name: cargo test (no macros)
        run: make test-no-macros

      # `bss-fixtures` is the only crate in the tree whose *production* surface
      # is the narrow one: pricing's `FixtureGate` inherits it with
      # `default-features = false`. `default = ["corpus"]`, so the workspace run
      # above compiles the wide build, where `tests/production_surface.rs`'s
      # assertions hold trivially and prove nothing they were written for.
      - name: cargo test (bss-fixtures narrow production surface)
        run: make test-fixtures-narrow

      # The qa-platform contract is generated from the gear code
      # (`gears/qa-platform/qa-platform-openapi`). This is the half of the
      # drift gate that needs a compiler: it rebuilds the document from the
      # handlers and DTOs and fails when the committed json disagrees. The
      # other half — json to `openapi.d.ts` — runs in the `ui` job, which has
      # Node and no Rust. Ubuntu only: the document is platform-independent
      # and rebuilding it on three runners buys nothing.
      - name: qa-platform OpenAPI contract is up to date
        if: runner.os == 'Linux'
        run: make qa-openapi-check
  ui:
    name: QA Platform UI
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.ui == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gears/qa-platform/qa-platform-ui/package-lock.json

      - name: Lint, test and build the UI
        run: make ui-lint ui-test ui-build

      # `ui-contract` used to be impossible here: it regenerated types from a
      # live /openapi.json on localhost:8087, which this job has no gears to
      # serve. `npm run gen:api` now reads the committed
      # `gears/qa-platform/docs/openapi.json` instead, so the drift check runs
      # with nothing but Node. `npm run gen:api` directly rather than `make
      # ui-contract`, because that target also runs `qa-openapi-check`, which
      # needs the Rust toolchain this job does not install — the `test` job
      # owns that half.
      - name: UI wire types match the committed contract
        run: |
          cd gears/qa-platform/qa-platform-ui && npm run gen:api
          cd "$GITHUB_WORKSPACE"
          git diff --exit-code -- \
            gears/qa-platform/qa-platform-ui/src/api/generated/openapi.d.ts \
            || { echo "::error::UI wire types are stale: run 'make ui-contract' and commit"; exit 1; }

  integration:
    name: Integration tests
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install protoc
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: protoc@3.34.1

      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Install nextest
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: nextest

      - name: Cache Cargo/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-targets: false
          shared-key: pr-${{ runner.os }}-integration-${{ hashFiles('rust-toolchain.toml') }}

      # Install sccache (cross-platform)
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Probe sccache; if startup fails, fall back to plain rustc (no hard CI failure).
      - name: Probe sccache & set RUSTC_WRAPPER
        shell: bash
        run: |
          if sccache --start-server >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "sccache failed, falling back to plain rustc"
          fi

      - name: UI tests for toolkit macros libraries
        run: make test-macros

      - name: Test users_info with Postgres (integration)
        run: make test-users-info-pg

      - name: Test timescaledb usage-collector plugin (pg integration)
        run: make test-usage-collector-pg

      - name: Test postgres-cluster-plugin (pg integration)
        run: make test-cluster-pg

      - name: Test resource-group (pg smoke, integration)
        # Fail if Docker is unreachable instead of letting the suite skip itself
        # into a green step that asserted nothing.
        env:
          RG_PG_REQUIRE_DOCKER: "1"
        run: make test-rg-pg

      # bss-pricing's Postgres tests are `#[ignore]`d behind Docker and ran in
      # no job until 2026-08-11 — every concurrency and trigger proof the crate
      # owns lives in them. This job already has Docker. The target passes
      # `--no-fail-fast`; see the Makefile for what the default cost on 2026-08-18.
      - name: Test bss-pricing with Postgres (integration)
        run: make test-pricing-pg

      # coord's `m0001_…` writes two independent SQL literals and only the
      # SQLite one is reachable from the in-crate tests — so the `IF NOT EXISTS`
      # that stops the `bss-pricing`-beside-`bss-ledger` boot crash, and the
      # `in_schema("bss")` form both gears actually pass, ran in no job.
      - name: Test coord with Postgres (integration)
        run: make test-coord-pg
      - name: Test qa-runs with Postgres (integration)
        run: make test-qa-runs-pg

      - name: Test qa-insights with Postgres (integration)
        run: make test-qa-insights-pg

      - name: Test qa-catalog with the real git transport (integration)
        run: make test-qa-catalog-git

      - name: Test qa-platform feature-gated adapters (argo, runner-secret)
        run: make test-qa-platform-features

      - name: Test toolkit-db (sqlite integration)
        run: make test-sqlite

      - name: Test toolkit-db (pg integration)
        run: make test-pg

      - name: Test toolkit-db (mysql integration)
        run: make test-mysql

  test-fips:
    name: FIPS verification (${{ matrix.os }})
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.fips == 'true'
      || needs.changes.outputs.deps == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    env:
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Force LF in working tree (w/a for Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install protoc
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: protoc@3.34.1

      # Go is only required for the aws-lc-fips-sys build on the Linux lane.
      - name: Install Go (required for aws-lc-fips-sys FIPS build)
        if: runner.os == 'Linux'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21.x'  # pinned - see docs/security/fips/TOOLCHAIN.md
          cache: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Install nextest
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: nextest

      # FIPS builds use a SEPARATE sccache bucket from non-FIPS jobs. The `-fips`
      # cache-key segment guarantees a runner that toggles between FIPS and
      # non-FIPS builds never reuses non-FIPS object files, which would otherwise
      # silently produce a mixed binary that passes tests but isn't a true FIPS build.
      - name: Cache Cargo/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-targets: false
          shared-key: pr-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-fips

      # Install sccache (cross-platform)
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Probe sccache; if startup fails, fall back to plain rustc (no hard CI failure).
      - name: Probe sccache & set RUSTC_WRAPPER
        shell: bash
        run: |
          if sccache --start-server >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "sccache failed, falling back to plain rustc"
          fi

      # Linux: aws-lc-fips path via the existing make target
      # (cf-gears-toolkit + cf-gears-toolkit-http, bootstrap + fips).
      - name: FIPS tests (Linux / aws-lc-fips)
        if: runner.os == 'Linux'
        shell: bash
        run: make test-fips

      # macOS: exercise the Apple corecrypto TLS provider path.
      - name: FIPS tests (macOS / corecrypto)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo test -p cf-gears-rustls-corecrypto-provider --features fips
          cargo test -p cf-gears-toolkit-http --features fips

      # Windows: build-verify the CNG provider path. Compile-only is sufficient —
      # runtime FIPS execution depends on host FIPS-mode policy (see ADR 0003).
      - name: FIPS build check (Windows / CNG)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo check --target x86_64-pc-windows-msvc -p cf-gears-toolkit-http --features fips

  # Builds and tests file-parser's optional `magika` feature so it doesn't
  # silently rot. `ort`'s own `download-binaries` feature is NOT used here —
  # it always links statically, which conflicts with `load-dynamic` (baked
  # into the workspace `ort` dependency for production) and reliably
  # deadlocks `ort` 2.0.0-rc.12 (confirmed via stack sampling: its
  # error-reporting path for a failed/incompatible runtime recursively
  # re-enters the same `OnceLock` it's initializing, blocking the thread
  # forever instead of returning an error). Instead, this job downloads a
  # real ONNX Runtime shared library and points `ORT_DYLIB_PATH` at it —
  # exactly the mechanism production uses. `timeout-minutes` on the test step
  # is a backstop in case a future regression reintroduces that hang.
  test-magika:
    name: Magika feature verification
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.magika == 'true'
      || needs.changes.outputs.deps == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      # api-24 (see workspace Cargo.toml `ort` entry) requires an ONNX
      # Runtime with minor version >= 24; older builds fail `ort`'s version
      # check on load. Bump alongside `ort`'s pinned version.
      ONNXRUNTIME_VERSION: "1.29.0"
      # sha256 of onnxruntime-linux-x64-1.29.0.tgz. Recompute and bump
      # alongside ONNXRUNTIME_VERSION.
      ONNXRUNTIME_SHA256: "c3fddc4f139a045b0c4902c57410f0694f1c2fdf9b6939fbe38b1aeae7cd14ba"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Cache Cargo/target
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          cache-bin: false
          cache-targets: false
          shared-key: pr-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-magika

      - name: Install sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Probe sccache & set RUSTC_WRAPPER
        shell: bash
        run: |
          if sccache --start-server >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "sccache failed, falling back to plain rustc"
          fi

      - name: Fetch ONNX Runtime shared library
        shell: bash
        run: |
          set -euo pipefail
          curl -sL --fail -o /tmp/onnxruntime.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          echo "${ONNXRUNTIME_SHA256}  /tmp/onnxruntime.tgz" | sha256sum --check
          tar xzf /tmp/onnxruntime.tgz -C /tmp
          echo "ORT_DYLIB_PATH=/tmp/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}/lib/libonnxruntime.so" >> "$GITHUB_ENV"

      - name: cargo test (file-parser, magika feature)
        shell: bash
        timeout-minutes: 10
        run: cargo test -p cf-gears-file-parser --features magika

      - name: Install cargo-deny
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check (magika feature)
        run: make deny-magika

  cfs:
    name: CFS
    uses: ./.github/workflows/cfs.yml

  security:
    name: Security (cargo-deny on Ubuntu)
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.deps == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # Install tools via prebuilt binaries for speed.
      - name: Install cargo-deny
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: cargo-deny@0.20.2

      # Blocking gate: advisories, licenses, bans and sources.
      - name: cargo deny check
        run: make deny

  coverage:
    name: Code Coverage (cargo-llvm-cov)
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.result != 'success'
      || needs.changes.outputs.rust == 'true'
      || needs.changes.outputs.ci == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install protoc
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: protoc@3.34.1

      - name: Install Rust toolchain (with llvm-tools)
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN_NIGHTLY }}
          components: llvm-tools-preview

      # Override rust-toolchain.toml (which pins stable) for all cargo
      # commands in this job.
      - name: Pin nightly for all cargo commands
        run: echo "RUSTUP_TOOLCHAIN=${{ env.RUSTUP_TOOLCHAIN_NIGHTLY }}" >> "$GITHUB_ENV"

      - name: Cache Cargo/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-targets: false
          shared-key: pr-${{ runner.os }}-nightly-${{ env.RUSTUP_TOOLCHAIN_NIGHTLY }}-llvm-cov

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: cargo-llvm-cov, nextest

      # Generate lcov.info for upload. Customize flags/features as needed.
      - name: Coverage (lcov)
        env:
          RUSTFLAGS: "-C debuginfo=0 --cfg coverage_nightly"
          CARGO_LLVM_COV_TARGET_DIR: llvm-cov-target
          CARGO_LLVM_COV_BUILD_DIR: llvm-cov-build
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --workspace --lcov --output-path lcov.info

      # Upload LCOV report as a GitHub Actions artifact so it is always
      # available, even when Codecov is unavailable or rejects the upload.
      - name: Upload LCOV artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 14

      # Upload to Codecov. OIDC is used for non-fork events (push, dispatch);
      # for fork PRs the action auto-detects the fork and falls back to
      # tokenless upload (GitHub does not grant id-token:write for forks).
      # fail_ci_if_error is true for non-fork events so upload failures are
      # visible; for fork PRs it is best-effort (tokenless can be rate-limited).
      # disable_search prevents auto-discovery of unrelated files (e.g.
      # coverage_guard.rs) — only lcov.info is sent.
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: ${{ github.event_name != 'pull_request' }}
          files: lcov.info
          disable_search: true
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

  lint:
    name: Architecture Lints (cargo gears lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Install pytest
        run: python3 -m pip install --quiet pytest pyyaml

      - name: Run the qa-platform Helm chart guards
        run: make helm-tests

      # `helm lint` and kubeconform both validate the RENDERED chart, not
      # the templates -- the templates are Go-template text, not valid
      # Kubernetes YAML, until `helm template` fills them in. Both steps
      # pass the same fixture --set values the guard scripts above use.
      # FOUR values have no default on purpose, so a bare render/lint with no
      # overrides fails before either tool gets a chance to run: publicOrigin
      # (WS3 Task 1), keycloak.adminPassword (WS3 Task 3), and the two signing
      # secrets (2026-09-21 -- each is the only access control on an
      # anonymously reachable route, and their old per-render `randAlphaNum`
      # fallback silently rotated the key on every upgrade).
      - name: helm lint (qa-platform)
        run: |
          helm lint gears/qa-platform/deploy/helm/qa-platform \
            --set publicOrigin=https://example-ci-lint.invalid \
            --set keycloak.adminPassword=ci-fixture-not-a-real-password \
            --set bundleDownloadSigningSecret=ci-fixture-not-a-real-bundle-key \
            --set collectReportSigningSecret=ci-fixture-not-a-real-collect-key

      # kubeconform is not on the taiki-e/install-action tool registry and
      # is not preinstalled on ubuntu-latest, so it is fetched directly
      # from its GitHub release the same way oasdiff is in
      # api_contracts.yml -- a pinned version plus a checked SHA-256, not a
      # floating "latest".
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: "0.8.0"
          KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tgz
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tgz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tgz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          chmod +x /usr/local/bin/kubeconform

      - name: kubeconform (rendered qa-platform manifests)
        run: |
          helm template qa-platform gears/qa-platform/deploy/helm/qa-platform \
            --namespace qa-platform \
            --set publicOrigin=https://example-ci-lint.invalid \
            --set keycloak.adminPassword=ci-fixture-not-a-real-password \
            --set bundleDownloadSigningSecret=ci-fixture-not-a-real-bundle-key \
            --set collectReportSigningSecret=ci-fixture-not-a-real-collect-key \
            | kubeconform -strict -summary

      - name: Install protoc
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: protoc@3.34.1

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable

      - name: Install cargo-gears
        run: cargo install --locked cargo-gears

      - name: Run architecture lints
        run: cargo gears lint --dylint
