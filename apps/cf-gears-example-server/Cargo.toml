# Updated: 2026-04-16 by Constructor Tech
[package]
name = "cf-gears-example-server"
version = "0.6.1"
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
file-parser = ["dep:file_parser"]
github-mirror = ["dep:github_mirror"]
simple-user-settings = ["dep:simple_user_settings"]
nodes-registry = ["dep:nodes_registry"]
resource-group = ["dep:resource_group"]
grpc-hub = ["dep:grpc_hub"]
oagw = ["dep:api_egress"]
credstore = ["dep:credstore"]
# FIPS-140-3: use the AWS-LC FIPS-validated crypto module for all cryptographic operations
fips = ["toolkit/fips", "oagw", "api_egress?/fips"]
users-info-example = ["dep:users-info"]
oop-example = ["dep:calculator-gateway", "dep:calculator"]
single-tenant = ["dep:single-tenant-tr-plugin"]
static-tenants = ["dep:static-tr-plugin"]
static-authn = ["dep:static-authn-plugin"]
oidc-authn = ["dep:oidc-authn-plugin"]
static-authz = ["dep:static-authz-plugin"]
static-license = ["dep:static-license-plugin"]
tr-authz = ["dep:tr-authz-plugin"]
tenant-resolver-rg = ["dep:rg-tr-plugin"]
static-credstore = ["credstore", "dep:static-credstore-plugin"]
# The database-backed credstore plugin. OFF by default: with it absent the
# stack behaves exactly as before, and with it present but
# `credstore.config.vendor` left alone the in-memory plugin still wins the
# vendor match, so this feature alone changes no secret resolution -- it only
# lets the plugin's own gear (and its migration) exist.
postgres-credstore = ["credstore", "dep:postgres-credstore-plugin"]
mini-chat = ["dep:mini-chat"]
chat-engine = ["dep:chat-engine"]
k8s = ["mini-chat/k8s", "chat-engine?/k8s"]
otel = ["toolkit/otel"]
account-management = ["dep:account_management"]
static-idp = ["dep:static-idp-plugin"]
file-storage = ["dep:file_storage"]
# The FX rate-provider subsystem: the core gear + its source plugins. Independent
# of bss-ledger — the ledger discovers the composite lazily at runtime via the
# types-registry, so neither feature requires the other.
bss-rate-provider = [
    "dep:bss_rate_provider",
    "dep:bss_rate_provider_ecb_plugin",
    "dep:bss_rate_provider_http_json_plugin",
]
bss-ledger = ["dep:bss_ledger"]
usage-collector = ["dep:usage_collector"]
timescaledb-usage-collector = ["dep:timescaledb_usage_collector_plugin"]
# Content-based file type detection in file-parser (see that crate's `magika`
# feature doc comment for what it pulls in).
magika = ["file_parser/magika"]
bss-pricing = ["dep:bss_pricing"]
# The four QA Platform gears plus the VHP product plugin. The plugin is part
# of this feature rather than a switch of its own because after Task 19 there
# is no other way for a qa-platform deployment to observe a VHP environment or
# dispatch a run against one -- the product-agnostic gears carry no VHP
# knowledge at all, so a `qa-platform` build without it is a stack that can
# store environments and do nothing with them.
#
# ADR-0001: this is what puts `kube`/`k8s-openapi` in a `--features
# qa-platform` build, which it was not in before. That is the containment
# PRODUCT-PLUGINS-DESIGN.md 4.1 amended ADR-0001 to: `kube` is named
# unconditionally by exactly one qa-platform crate (`qa-connector-k8s`) and
# reaches a binary only through a product plugin that links it. Not "by one
# crate in the workspace" — `qa-environments` and `qa-runs` still name it
# behind `platform-observation` and `argo` respectively, and `--features
# "$(cat gears/qa-platform/deploy/cargo-features.argo)"` puts all three in the
# tree today. `qa-platform` is still off by default here (`default = []`), so
# the waiver's "reachable only through a cargo feature that is off by default"
# holds unchanged; what changed is that the Kubernetes edge now arrives with
# the product plugin instead of with the separate `platform-observation` switch
# below, which Task 19 deletes.
#
# The cost, recorded in ADR-0001's 2026-09-04 amendment rather than only here:
# because `qa-connector-k8s` has no feature gate and this list names the plugin
# unconditionally, there is no longer any way to build the `qa-platform`
# feature without `kube`. Before Phase C there was, and that build is what the
# feature gate bought.
qa-platform = ["dep:qa-environments", "dep:qa-catalog", "dep:qa-runs", "dep:qa-insights", "dep:qa-vhp-product-plugin"]
# The Argo Workflows execution adapter inside qa-runs. OFF unless named
# explicitly, which is ADR-0001's 2026-08-27 waiver condition 1: "the
# kube/k8s-openapi dependency is optional and reachable only through a cargo
# feature that is off by default". `qa-runs?/argo` (with the `?`) does NOT pull
# qa-runs in on its own -- naming this feature without `qa-platform` compiles
# nothing extra -- which is the same shape as `k8s = ["chat-engine?/k8s"]`
# above. Passed by gears/qa-platform/deploy/remote/sync.sh --argo through the
# image's CARGO_FEATURES build arg, and by nothing else.
qa-runs-argo = ["qa-runs?/argo"]
# Decision D4's runner-`Secret` writer in qa-environments
# (`infra::runner_secret_writer`) -- the only Kubernetes client left in that
# gear, since Task 19b deleted the observer this used to gate. Same shape as `qa-runs-argo` above: `qa-environments?/`
# (with the `?`) does NOT pull qa-environments in on its own, so naming this
# feature without `qa-platform` compiles nothing extra.
runner-secret = ["qa-environments?/runner-secret"]

[dependencies]
mimalloc = { version = "0.1" }
# Local crates
toolkit = { workspace = true, features = ["bootstrap"] }

# System gears
api_gateway = { package = "cf-gears-api-gateway", path = "../../gears/system/api-gateway" }
api_egress = { package = "cf-gears-oagw", path = "../../gears/system/oagw/oagw", optional = true }
grpc_hub = { package = "cf-gears-grpc-hub", path = "../../gears/system/grpc-hub", optional = true }
gear_orchestrator = { package = "cf-gears-gear-orchestrator", path = "../../gears/system/gear-orchestrator" }
types_registry = { package = "cf-gears-types-registry", path = "../../gears/system/types-registry/types-registry" }
tenant-resolver = { package = "cf-gears-tenant-resolver", path = "../../gears/system/tenant-resolver/tenant-resolver" }
authn-resolver = { package = "cf-gears-authn-resolver", path = "../../gears/system/authn-resolver/authn-resolver" }
authz-resolver = { package = "cf-gears-authz-resolver", path = "../../gears/system/authz-resolver/authz-resolver" }
license-resolver = { package = "cf-gears-license-resolver", path = "../../gears/system/license-resolver/license-resolver" }

# Optional tenant resolver plugins
single-tenant-tr-plugin = { package = "cf-gears-single-tenant-tr-plugin", path = "../../gears/system/tenant-resolver/plugins/single-tenant-tr-plugin", optional = true }
static-tr-plugin = { package = "cf-gears-static-tr-plugin", path = "../../gears/system/tenant-resolver/plugins/static-tr-plugin", optional = true }
rg-tr-plugin = { package = "cf-gears-rg-tr-plugin", path = "../../gears/system/tenant-resolver/plugins/rg-tr-plugin", optional = true }

# Optional authn/authz plugins
static-authn-plugin = { package = "cf-gears-static-authn-plugin", path = "../../gears/system/authn-resolver/plugins/static-authn-plugin", optional = true }
oidc-authn-plugin = { package = "cf-gears-oidc-authn-plugin", path = "../../gears/system/authn-resolver/plugins/oidc-authn-plugin", optional = true }
static-authz-plugin = { package = "cf-gears-static-authz-plugin", path = "../../gears/system/authz-resolver/plugins/static-authz-plugin", optional = true }
tr-authz-plugin = { package = "cf-gears-tr-authz-plugin", path = "../../gears/system/authz-resolver/plugins/tr-authz-plugin", optional = true }

# Optional license resolver plugins
static-license-plugin = { package = "cf-gears-static-license-plugin", path = "../../gears/system/license-resolver/plugins/static-license-plugin", optional = true }

# Optional credstore plugins
static-credstore-plugin = { package = "cf-gears-static-credstore-plugin", path = "../../gears/credstore/plugins/static-credstore-plugin", optional = true }
postgres-credstore-plugin = { package = "cf-gears-postgres-credstore-plugin", path = "../../gears/credstore/plugins/postgres-credstore-plugin", optional = true }

resource_group = { package = "cf-gears-resource-group", path = "../../gears/system/resource-group/resource-group", optional = true }

# user modules
file_parser = { package = "cf-gears-file-parser", path = "../../gears/file-parser/file-parser", optional = true }
file_storage = { package = "cf-gears-file-storage", path = "../../gears/file-storage/file-storage", optional = true }
github_mirror = { package = "cf-gears-github-mirror", path = "../../gears/github-mirror/github-mirror", optional = true }
nodes_registry = { package = "cf-gears-nodes-registry", path = "../../gears/system/nodes-registry/nodes-registry", optional = true }
simple_user_settings = { package = "cf-gears-simple-user-settings", path = "../../gears/simple-user-settings/simple-user-settings", optional = true }
credstore = { package = "cf-gears-credstore", path = "../../gears/credstore/credstore", optional = true }

anyhow = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

# Optional mini-chat gear
mini-chat = { package = "cf-gears-mini-chat", path = "../../gears/mini-chat/mini-chat", optional = true }

# Optional chat-engine gear
chat-engine = { package = "cf-chat-engine", path = "../../gears/chat-engine/chat-engine", optional = true }

# Optional Account Management gear
account_management = { package = "cf-gears-account-management", path = "../../gears/system/account-management/account-management", optional = true }
static-idp-plugin = { package = "cf-gears-static-idp-plugin", path = "../../gears/system/account-management/plugins/static-idp-plugin", optional = true }

# Optional BSS Billing Ledger gear
bss_ledger = { package = "cf-gears-bss-ledger", path = "../../gears/bss/ledger/ledger", optional = true }
bss_rate_provider = { package = "cf-gears-bss-rate-provider", path = "../../gears/bss/rate-provider/rate-provider", optional = true }
bss_rate_provider_ecb_plugin = { package = "cf-gears-bss-rate-provider-ecb-plugin", path = "../../gears/bss/rate-provider/plugins/ecb-plugin", optional = true }
bss_rate_provider_http_json_plugin = { package = "cf-gears-bss-rate-provider-http-json-plugin", path = "../../gears/bss/rate-provider/plugins/http-json-plugin", optional = true }

# Optional Usage Collector gear + its TimescaleDB storage plugin
usage_collector = { package = "cf-gears-usage-collector", path = "../../gears/system/usage-collector/usage-collector", optional = true }
timescaledb_usage_collector_plugin = { package = "cf-gears-timescaledb-usage-collector-plugin", path = "../../gears/system/usage-collector/plugins/timescaledb-usage-collector-plugin", optional = true }
# Optional BSS Plan & Price Modeling gear
bss_pricing = { package = "cf-gears-bss-pricing", path = "../../gears/bss/pricing/pricing", optional = true }

# Optional QA Platform: qa-environments + qa-catalog + qa-runs + qa-insights gears
qa-environments = { path = "../../gears/qa-platform/qa-environments/qa-environments", optional = true }
qa-catalog = { path = "../../gears/qa-platform/qa-catalog/qa-catalog", optional = true }
qa-runs = { path = "../../gears/qa-platform/qa-runs/qa-runs", optional = true }
qa-insights = { path = "../../gears/qa-platform/qa-insights/qa-insights", optional = true }
qa-vhp-product-plugin = { path = "../../gears/qa-platform/plugins/qa-vhp-product-plugin", optional = true }

# Optional example module
users-info = { path = "../../examples/toolkit/users-info/users-info", optional = true }
calculator-gateway = { path = "../../examples/oop-gears/calculator-gateway/calculator-gateway", optional = true }
calculator = { path = "../../examples/oop-gears/calculator/calculator", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
# `tests/qa_product_plugin_boot.rs` only. It discovers this binary's own gear
# inventory, runs the VHP product plugin gear's `init` against
# `config/qa-platform.yaml`, and asserts the ClientHub resolves the plugin
# under its GTS instance id -- so it needs the plugin contract
# (`qa-product-sdk`) and a recording `TypesRegistryClient` of its own
# (`types-registry-sdk`, `async-trait`, `toolkit-canonical-errors`) plus the
# `Uuid`/`CancellationToken` a `GearCtx` is built from. Cargo forbids optional
# dev-dependencies, so these compile even without `qa-platform`; the test file
# itself is `#![cfg(feature = "qa-platform")]` and compiles to nothing.
qa-product-sdk = { path = "../../gears/qa-platform/qa-product-sdk" }
types-registry-sdk = { workspace = true }
toolkit-canonical-errors = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }
